  function syncFormants(v){
    if(!ctx||!v.bp) return;
    const now=ctx.currentTime;
    for(let i=0;i<v.formants.length;i++){
      const fm=v.formants[i], B=bwOf(fm,v.bwFrac);
      v.bp[i].frequency.setTargetAtTime(fm.F,now,0.02);
      v.bp[i].Q.setTargetAtTime(fm.F/B,now,0.02);
      const sign=(i%2===0)?1:-1;
      const active = v.mode==="voice" && fm.on;   // basic waveforms bypass the formant bank
      v.fg[i].gain.setTargetAtTime(active?sign*FORMANT_LEVEL:0,now,0.02);
    }
    const anyOn = v.mode==="voice" && v.formants.some(f=>f.on);
    v.dryGain.gain.setTargetAtTime(anyOn?0:1,now,0.02);
    v.formantMix.gain.setTargetAtTime(normGain(v),now,0.03);  // keep loudness steady across vowels
  }
  // Estimated RMS power of the filtered glottal source (bandpass magnitudes summed
  // across harmonics, phase ignored — fine for a level estimate).
  function spectralPower(fms, f0, srcExp, bwFrac){
    const top=Math.min(HEARING_TOP, (ctx?ctx.sampleRate:48000)/2);
    const N=Math.max(1,Math.floor(top/f0));
    let P=0;
    for(let n=1;n<=N;n++){
      const f=n*f0, A=Math.pow(n,-srcExp);
      let H=0, any=false;
      for(const fm of fms){
        if(!fm.on) continue; any=true;
        const B=Math.max(60, fm.F*bwFrac), Q=fm.F/B, r=f/fm.F;
        const d=1-r*r, e=r/Q;
        H+=FORMANT_LEVEL*e/Math.sqrt(d*d+e*e);
      }
      if(!any) H=1;                 // dry bypass passes the source flat
      const val=A*H; P+=val*val;
    }
    return P;
  }
  // intrinsic power (Σ of squared harmonic amplitudes) of each built-in waveform
  const WAVE_POWER={sine:1, sawtooth:2/3, square:2, triangle:2/3};
  // Compensating gain that holds loudness constant as the vowel changes,
  // normalized to the default formant centers as the reference vowel.
  // Plain waveforms are matched to that same reference-vowel level too.
  function normGain(v){
    const ref=spectralPower(DEFAULT_FORMANTS.map(f=>({F:f.F,on:true})), v.freq, v.srcExp, v.bwFrac);
    const src = v.mode==="voice" ? spectralPower(v.formants, v.freq, v.srcExp, v.bwFrac) : (WAVE_POWER[v.mode]||1);
    if(src<=0) return 1;
    return Math.max(0.1, Math.min(8, Math.sqrt(ref/src)));
  }
  function applyOscType(v){
    if(!v.osc) return;
    if(v.mode==="voice") v.osc.setPeriodicWave(computeWave(v.freq,v.srcExp));
    else v.osc.type=v.mode;
  }

  function tickHuman(){
    if(!state.playing||!ctx) return;
    const now=ctx.currentTime;
    voices.forEach(v=>{
      if(!v.osc) return;
      v.osc.detune.setTargetAtTime((Math.random()*2-1)*state.jitterCents, now, 0.05);   // bend is now global (folded into key freq); detune carries only jitter
      const target = isAudible(v)?v.level*(1+(Math.random()*2-1)*state.shimmer):0;
      v.voiceGain.gain.setTargetAtTime(Math.max(0,target), now, 0.06);
    });
  }

  function playAll(){
    ensureAudio();
    const now=ctx.currentTime;
    voices.forEach(v=>{
      v.osc=ctx.createOscillator();
      v.osc.frequency.value=v.freq;
      applyOscType(v);
      v.osc.connect(v.sourceBus);
      v.vibDepth.disconnect(); v.vibDepth.connect(v.osc.detune);
      v.osc.detune.setValueAtTime(-40,now);
      v.osc.detune.linearRampToValueAtTime(0,now+0.12);   // pitch-up attack settling to 0 (global bend lives in the key freq)
      v.osc.start();
      v.voiceGain.gain.cancelScheduledValues(now);
      v.voiceGain.gain.setValueAtTime(0,now);
      v.voiceGain.gain.linearRampToValueAtTime(isAudible(v)?v.level:0, now+0.07);
      syncFormants(v);
    });
    masterOut.gain.cancelScheduledValues(now);
    masterOut.gain.setValueAtTime(masterOut.gain.value,now);
    masterOut.gain.linearRampToValueAtTime(state.volume, now+0.07);
    state.playing=true;
    humanTimer=setInterval(tickHuman,110);
    startScope();
    playBtn.classList.add("on"); playBtn.textContent="■ Stop";
  }
  function stopAll(){
    if(!state.playing) return;
    clearInterval(humanTimer); humanTimer=null;
    stopScope();
    const now=ctx.currentTime;
    masterOut.gain.cancelScheduledValues(now);
    masterOut.gain.setValueAtTime(masterOut.gain.value,now);
    masterOut.gain.linearRampToValueAtTime(0, now+0.1);
    voices.forEach(v=>{ const d=v.osc; if(d){ setTimeout(()=>{try{d.stop();d.disconnect();}catch(e){}},160);} v.osc=null; });
    state.playing=false;
    playBtn.classList.remove("on"); playBtn.textContent="▶ Play quartet";
  }

  // ---------- output visualization (live, from the analyser tap on the final mix) ----------
  const scopeCv=document.getElementById("scope"), spectrumCv=document.getElementById("spectrum");
  const clipLbl=document.getElementById("cliplbl");
  function startScope(){
    if(!analyser||scopeRAF) return;
    timeBuf=new Float32Array(analyser.fftSize);
    freqBuf=new Uint8Array(analyser.frequencyBinCount);
    const frame=()=>{ scopeRAF=requestAnimationFrame(frame); drawWave(); drawSpectrum(); };
    frame();
  }
  function stopScope(){
    if(scopeRAF) cancelAnimationFrame(scopeRAF);
    scopeRAF=null;
    scopeCv.getContext("2d").clearRect(0,0,scopeCv.width,scopeCv.height);
    spectrumCv.getContext("2d").clearRect(0,0,spectrumCv.width,spectrumCv.height);
    clipLbl.textContent="level —"; clipLbl.style.color="var(--muted)";
  }
  function drawWave(){
    const g=scopeCv.getContext("2d"), W=scopeCv.width, H=scopeCv.height, mid=H/2, amp=(H/2)*0.82;
    analyser.getFloatTimeDomainData(timeBuf);
    g.clearRect(0,0,W,H);
    g.strokeStyle="#2c2010"; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,mid); g.lineTo(W,mid); g.stroke();
    g.strokeStyle="#6b5128"; g.setLineDash([4,4]);
    g.beginPath(); g.moveTo(0,mid-amp); g.lineTo(W,mid-amp); g.moveTo(0,mid+amp); g.lineTo(W,mid+amp); g.stroke();
    g.setLineDash([]);
    const N=timeBuf.length, step=N/W; let peak=0;
    g.beginPath();
    for(let x=0;x<W;x++){
      const v=timeBuf[Math.floor(x*step)];
      if(Math.abs(v)>peak) peak=Math.abs(v);
      let y=mid-v*amp; if(y<0)y=0; else if(y>H)y=H;
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    const clipped=peak>=1.0;
    g.strokeStyle=clipped?"#ff5a4a":"#ffb347"; g.lineWidth=1.5; g.stroke();
    clipLbl.textContent=clipped?`peak ${peak.toFixed(2)} · CLIPPING`:`peak ${peak.toFixed(2)}`;
    clipLbl.style.color=clipped?"#ff5a5a":(peak>0.85?"#ffce54":"var(--muted)");
  }
  function drawSpectrum(){
    const g=spectrumCv.getContext("2d"), W=spectrumCv.width, H=spectrumCv.height, base=H-12;
    analyser.getByteFrequencyData(freqBuf);
    g.clearRect(0,0,W,H);
    const bins=freqBuf.length, nyq=ctx.sampleRate/2;
    const fmin=30, fmax=Math.min(20000,nyq);
    const lmin=Math.log10(fmin), lspan=Math.log10(fmax)-lmin;
    const xOf=f=>(Math.log10(f)-lmin)/lspan*W;
    g.strokeStyle="#2c2010"; g.fillStyle="#a07f4c"; g.font="9px sans-serif"; g.textAlign="center"; g.lineWidth=1;
    for(const f of [100,200,500,1000,2000,5000,10000]){
      if(f>fmax) continue;
      const x=xOf(f);
      g.beginPath(); g.moveTo(x,0); g.lineTo(x,base); g.stroke();
      g.fillText(f>=1000?(f/1000)+"k":f, x, H-2);
    }
    g.beginPath();
    for(let x=0;x<W;x++){
      const f=Math.pow(10, lmin+x/W*lspan);
      const v=freqBuf[Math.min(bins-1,Math.round(f/nyq*bins))]/255;
      const y=base-v*(base-4);
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.strokeStyle="#ff8a2e"; g.lineWidth=1.5; g.stroke();
    g.lineTo(W,base); g.lineTo(0,base); g.closePath(); g.fillStyle="rgba(255,138,46,0.16)"; g.fill();
    // red comb: the implied fundamental and its harmonic series
    const f0=state.fundHz;
    if(f0&&f0>0){
      const MAIN="rgba(255,74,74,0.95)", OTH="rgba(255,74,74,0.6)";
      let lastx=-10;
      for(let k=1;k*f0<=fmax;k++){
        const fk=k*f0; if(fk<fmin) continue;
        const x=xOf(fk);
        if(x-lastx<3) continue; lastx=x;            // skip lines that would visually merge at the top end
        g.strokeStyle=k===1?MAIN:OTH;
        g.lineWidth=k===1?1.6:1;
        g.beginPath(); g.moveTo(x,0); g.lineTo(x,base); g.stroke();
      }
      g.fillStyle="#ff8a8a"; g.font="9px sans-serif"; g.textAlign="left";
      g.fillText(`f₀ ${f0.toFixed(0)} Hz`, clamp(xOf(f0)+3,2,W-58), 10);
    }
  }
  // ============================================================ pitch logic
  // a chord tone's value relative to the chord root — just, or snapped to 12-ET
  const chordToneVal = t => { const r=rval(t); return state.et ? etOf(r) : r; };
  function computeAbsPcs(){
    const root=rval(DEGREES[state.rootIdx].r);   // chord root vs key center stays JI so the root pitch is pinned
    state.absPcs = CHORDS[state.chordIdx].r.map(t => octRed(root*chordToneVal(t)));
  }
  function recomputeChord(){
    computeAbsPcs();
    state.voicing = defaultVoicing(state.absPcs);
    renderVoicing();
    applyFreqs();
  }
  // The implied fundamental: the (JI-ideal) common harmonic-series root the whole chord
  // sits on — e.g. two octaves below the root for 4:5:6:7, but root⁄10 for a 10:12:15 minor.
  // Computed exactly from the chord ratios + each voice's octave, independent of the ET toggle,
  // so the red guide stays put and ET partials visibly drift off it.
  function impliedFundamentalHz(){
    if(!state.voicing.length) return null;
    const [rp,rq]=DEGREES[state.rootIdx].r.split("/").map(Number), rootVal=rp/rq;
    const fr=[];   // each realized voice as an exact fraction of keyFreq: (rootDeg · tone · 2^e)
    state.voicing.forEach(slot=>{
      const [p,q]=CHORDS[state.chordIdx].r[slot.tone].split("/").map(Number);
      const e=Math.round(Math.log2(octRed(rootVal*p/q)*Math.pow(2,slot.octave)/(rootVal*p/q)));
      let a=rp*p, b=rq*q;
      if(e>=0) a*=2**e; else b*=2**(-e);
      const g=gcd(a,b); fr.push([a/g,b/g]);
    });
    let den=1; fr.forEach(([,b])=> den=lcm(den,b));         // common denominator across voices
    let num=0; fr.forEach(([a,b])=> num=gcd(num,a*(den/b))); // greatest common rational = num/den
    return effKey() * num/den;
  }
  // Root position: the chord root (tone 0, always ratio 1/1) in the bass, the other tones stacked in
  // close position ascending above it (in tone-index order), then the whole thing shifted into a
  // central register. Part i (0=bass … 3=tenor) sings tone i. New chords always default to this; the
  // user respells by hand from here. (A shortest-motion voice-leading solver is a possible future default.)
  function defaultVoicing(pcs){
    const slots=[{tone:0, octave:0}];       // bass = root
    let prev=pcs[0];
    for(let t=1;t<pcs.length;t++){
      let o=0; while(pcs[t]*Math.pow(2,o)<=prev+1e-9) o++;   // lift until strictly above the voice below
      slots.push({tone:t, octave:o}); prev=pcs[t]*Math.pow(2,o);
    }
    const meanLog=slots.reduce((s,sl)=>s+Math.log2(pcs[sl.tone])+sl.octave,0)/slots.length;
    const sh=-Math.round(meanLog); slots.forEach(sl=>sl.octave+=sh);   // center the register near the key
    return slots;
  }
  // effective key center = the selected key, fine-tuned by the global pitch bend (cents).
  // Folding the bend in here (rather than per-voice detune) makes it a true transpose of the
  // whole quartet, so every note name / Hz readout reflects it as a shifted key center.
  const effKey = () => state.keyFreq * Math.pow(2, state.bendCents/1200);
  function slotFreq(slot){ return effKey() * state.absPcs[slot.tone] * Math.pow(2,slot.octave); }
  // distinct chord pitch classes, ascending, each with a representative tone index
  function chordPcs(){
    const seen=new Map();
    state.absPcs.forEach((pc,ti)=>{ if(!seen.has(pc)) seen.set(pc,ti); });
    return [...seen.entries()].map(([pc,ti])=>({pc,ti})).sort((a,b)=>a.pc-b.pc);
  }
  function applyFreqs(){
    state.voicing.forEach((slot,k)=>{
      const v=voices[k]; v.freq=slotFreq(slot);
      if(state.playing && v.osc){
        v.osc.frequency.setTargetAtTime(v.freq, ctx.currentTime, retuneTau());   // glide when stepping slots
        if(v.mode==="voice") v.osc.setPeriodicWave(computeWave(v.freq,v.srcExp));
      }
      updateVoiceInfo(v); syncFormants(v);  // syncFormants re-normalizes level for the new f0
    });
    state.fundHz = impliedFundamentalHz();
    drawSharedChart();
    onStateEdit();   // key / root / chord / tuning / voicing all funnel through here
  }

  // ============================================================ selector UI
  const playBtn=document.getElementById("play");

  // ---- key-center dial: concentric analog-radio wheels ----------------------------------------
  // Outer wheel = coarse note name: discrete (snaps per semitone), unlimited range (spin it to
  // wind through octaves). Inner wheel = fine pitch bend: smooth, absolute scale from 0¢ at the
  // top to ±100¢ at the bottom. Both fold into effKey(); the center shows the resulting key.
  const dialSvg=document.getElementById("keydial");
  const DVB=340, DCX=170, DCY=170;                 // viewBox + center
  const R_NOTE=152, R_OUT_HI=138, R_OUT_LO=100, R_INN_HI=95, R_INN_LO=48, R_CENT=80, R_CORE=44;
  const MIDI_LO=24, MIDI_HI=96;                     // C1..C7 clamp for the (otherwise "unlimited") spin
  const DP=(ang,r)=>[DCX+r*Math.sin(ang*Math.PI/180), DCY-r*Math.cos(ang*Math.PI/180)]; // 0°=top, CW+
  const tri=(ang,rTip,rBase,half,fill)=>{
    const t=DP(ang,rTip), a=DP(ang-half,rBase), b=DP(ang+half,rBase);
    return `<polygon points="${t[0].toFixed(1)},${t[1].toFixed(1)} ${a[0].toFixed(1)},${a[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="${fill}"/>`;
  };
  const fmtHz=h=> h<100 ? h.toFixed(1) : Math.round(h).toString();

  function drawKeyDial(){
    const pc=((state.keyMidi%12)+12)%12, oct=Math.floor(state.keyMidi/12)-1;
    const noteAng=pc*30, bendAng=state.bendCents*1.8;   // 30°/semitone, 1.8°/cent
    let s="";
    // dial body: outer wheel disc, then inner wheel disc, then core display
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_OUT_HI}" fill="#241a0d" stroke="#6b5128" stroke-width="1.5"/>`;
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_OUT_LO}" fill="#1b130a" stroke="#4a3820" stroke-width="1"/>`;
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_INN_HI}" fill="#2a1e10" stroke="#6b5128" stroke-width="1.5"/>`;
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_INN_LO}" fill="#140d06" stroke="#4a3820" stroke-width="1"/>`;
    // outer wheel: 12 note ticks + names around the edge (fixed clock face)
    for(let i=0;i<12;i++){
      const a=i*30, sel=i===pc;
      const t1=DP(a,R_OUT_HI-2), t2=DP(a,R_OUT_HI-11);
      s+=`<line x1="${t1[0].toFixed(1)}" y1="${t1[1].toFixed(1)}" x2="${t2[0].toFixed(1)}" y2="${t2[1].toFixed(1)}" stroke="${sel?"#e26a10":"#7d6743"}" stroke-width="${sel?2:1}"/>`;
      const [lx,ly]=DP(a,R_NOTE);
      s+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="${sel?800:600}" fill="${sel?"#ffb347":"#a98a55"}">${NOTE_NAMES[i]}</text>`;
    }
    // outer pointer: arrow riding the wheel, aimed OUT at the selected note
    s+=tri(noteAng, R_OUT_HI-3, R_OUT_LO+8, 7, "#e26a10");
    // inner wheel: cent ticks every 10¢ (0 at top → ±100 at bottom) + numbers
    for(let c=-100;c<=100;c+=10){
      const a=c*1.8, zero=c===0;
      const t1=DP(a,R_INN_HI-2), t2=DP(a,R_INN_HI-(c%20===0?9:6));
      s+=`<line x1="${t1[0].toFixed(1)}" y1="${t1[1].toFixed(1)}" x2="${t2[0].toFixed(1)}" y2="${t2[1].toFixed(1)}" stroke="${zero?"#ffb347":"#6b5128"}" stroke-width="1"/>`;
      if(c%20===0){
        const la=Math.abs(c)===100 ? Math.sign(c)*172 : a;   // nudge the two bottom labels apart
        const [lx,ly]=DP(la,R_CENT);
        s+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="${zero?"#ffce87":"#8a744c"}">${c>0?"+"+c:c}</text>`;
      }
    }
    // inner pointer: arrow riding the wheel, aimed IN toward the core
    s+=tri(bendAng, R_INN_LO+3, R_INN_LO+18, 7, "#ffb347");
    // core: note name of the key center + resulting Hz (note name stays put past ±50¢ — see spec)
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_CORE}" fill="#0e0904" stroke="#6b5128" stroke-width="1.5"/>`;
    s+=`<text x="${DCX}" y="${DCY-3}" text-anchor="middle" font-size="26" font-weight="800" fill="#ffce87">${NOTE_NAMES[pc]}${oct}</text>`;
    s+=`<text x="${DCX}" y="${DCY+18}" text-anchor="middle" font-size="12" font-weight="600" fill="#c9b78f">${fmtHz(effKey())} Hz</text>`;
    dialSvg.innerHTML=s;
  }

  function setKeyFromFreq(freq){
    const m=Math.round(69+12*Math.log2(freq/440));
    state.keyMidi=clamp(m, MIDI_LO, MIDI_HI);
    state.keyFreq=midiToFreq(state.keyMidi);
  }
  function commitKey(nm){
    nm=clamp(nm, MIDI_LO, MIDI_HI);
    if(nm!==state.keyMidi){ state.keyMidi=nm; state.keyFreq=midiToFreq(nm); applyFreqs(); renderVoicing(); syncKeyAcrossSlots(); }
    drawKeyDial(); drawRootDial();   // root's note readout follows the key
  }
  function commitBend(c){
    c=clamp(c,-100,100);
    if(c!==state.bendCents){ state.bendCents=c; applyFreqs(); renderVoicing(); syncKeyAcrossSlots(); }
    drawKeyDial(); drawRootDial();
  }

  // pointer interaction: pick a wheel by grab radius, then drag
  let dialDrag=null;
  function polarAt(svg,e){   // pointer position on a dial, in its viewBox polar coords
    const r=svg.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*DVB-DCX, y=(e.clientY-r.top)/r.height*DVB-DCY;
    return {ang:Math.atan2(x,-y)*180/Math.PI, rad:Math.hypot(x,y)};   // ang: 0=top, CW+, (-180,180]
  }
  dialSvg.addEventListener("pointerdown",e=>{
    const {ang,rad}=polarAt(dialSvg,e);
    if(rad>=R_INN_LO-6 && rad<=R_INN_HI+3){
      dialDrag={wheel:"inner", prev:clamp(ang/1.8,-100,100)};
      commitBend(dialDrag.prev);
    } else if(rad>=R_OUT_LO-2 && rad<=R_NOTE+10){
      dialDrag={wheel:"outer", last:ang, accum:0, start:state.keyMidi};
    } else return;
    try{ dialSvg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  window.addEventListener("pointermove",e=>{
    if(!dialDrag) return;
    const {ang}=polarAt(dialSvg,e);
    if(dialDrag.wheel==="inner"){
      let c=clamp(ang/1.8,-100,100);
      if(Math.abs(c-dialDrag.prev)>120) c=dialDrag.prev>0?100:-100;   // don't teleport across the bottom
      dialDrag.prev=c; commitBend(c);
    } else {
      let d=ang-dialDrag.last; if(d>180)d-=360; else if(d<-180)d+=360;
      dialDrag.accum+=d; dialDrag.last=ang;
      commitKey(dialDrag.start+Math.round(dialDrag.accum/30));   // 30° == one semitone snap
    }
  });
  window.addEventListener("pointerup",()=>{ dialDrag=null; });
  window.addEventListener("pointercancel",()=>{ dialDrag=null; });

  // ---- chord-root dial: a single discrete wheel (matched to the key dial), 12 scale degrees ----
  // Cyclic (wraps mod 12); the center shows the picked degree + the note it lands on in the current key.
  const rootDialSvg=document.getElementById("rootdial");
  function drawRootDial(){
    const idx=((state.rootIdx%12)+12)%12, a0=idx*30;
    const rootFreq=effKey()*rval(DEGREES[idx].r);
    let s="";
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_OUT_HI}" fill="#241a0d" stroke="#6b5128" stroke-width="1.5"/>`;
    s+=`<circle cx="${DCX}" cy="${DCY}" r="${R_OUT_LO}" fill="#140d06" stroke="#4a3820" stroke-width="1"/>`;  // big core
    for(let i=0;i<12;i++){
      const a=i*30, sel=i===idx;
      const t1=DP(a,R_OUT_HI-2), t2=DP(a,R_OUT_HI-11);
      s+=`<line x1="${t1[0].toFixed(1)}" y1="${t1[1].toFixed(1)}" x2="${t2[0].toFixed(1)}" y2="${t2[1].toFixed(1)}" stroke="${sel?"#e26a10":"#7d6743"}" stroke-width="${sel?2:1}"/>`;
      const [lx,ly]=DP(a,R_NOTE);
      s+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="${sel?800:600}" fill="${sel?"#ffb347":"#a98a55"}">${ROMAN[i]}</text>`;
    }
    s+=tri(a0, R_OUT_HI-3, R_OUT_LO+8, 7, "#e26a10");
    s+=`<text x="${DCX}" y="${DCY+13}" text-anchor="middle" font-size="34" font-weight="800" fill="#ffce87">${romanOf(idx)}</text>`;
    rootDialSvg.innerHTML=s;
  }
  function commitRoot(idx){
    idx=((idx%12)+12)%12;
    if(idx!==state.rootIdx){ state.rootIdx=idx; recomputeChord(); }
    drawRootDial();
  }
  let rootDrag=null;
  rootDialSvg.addEventListener("pointerdown",e=>{
    const {ang,rad}=polarAt(rootDialSvg,e);
    if(rad>R_NOTE+12) return;
    rootDrag={last:ang, accum:0, start:state.rootIdx};
    try{ rootDialSvg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  window.addEventListener("pointermove",e=>{
    if(!rootDrag) return;
    const {ang}=polarAt(rootDialSvg,e);
    let d=ang-rootDrag.last; if(d>180)d-=360; else if(d<-180)d+=360;
    rootDrag.accum+=d; rootDrag.last=ang;
    commitRoot(rootDrag.start+Math.round(rootDrag.accum/30));   // 30° == one degree snap
  });
  window.addEventListener("pointerup",()=>{ rootDrag=null; });
  window.addEventListener("pointercancel",()=>{ rootDrag=null; });

  const chordsEl=document.getElementById("chords");
  CHORDS.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=c.name;
    b.addEventListener("click",()=>{ state.chordIdx=i; markSel(chordsEl,i); recomputeChord(); });
    chordsEl.appendChild(b);
  });
  function markSel(container,i){ [...container.children].forEach((c,j)=>c.classList.toggle("sel",j===i)); }

  const voicingEl=document.getElementById("voicing");

  // pitch → vertical position on the lattice, as a PERCENT down the content. The content fills the full
  // (canvas-matched) lattice height, so the whole ~4-octave window (G1..A5) always spans the same box top
  // to bottom, high notes near the top. Depends only on the fixed window, not the chord, so stepping
  // chords never reshapes the lattice. A small top/bottom margin keeps the edge rows fully in view.
  const LAT_MLO=31, LAT_MHI=81, LAT_PAD_PCT=3;
  const midiOf = f => 69 + 12*Math.log2(f/440);
  const latY = f => LAT_PAD_PCT + (LAT_MHI - midiOf(f))/(LAT_MHI-LAT_MLO)*(100-2*LAT_PAD_PCT);
  const MAX_PER_PITCH = 2;                                  // at most two voices may double one pitch
  const fkey = f => f.toFixed(2);                           // group voices/pegs that share a pitch

  // every chord tone at every octave inside the window = the set of places a voice can be dragged to.
  function latticePegs(){
    const fLo=midiToFreq(LAT_MLO), fHi=midiToFreq(LAT_MHI), pegs=[];
    chordPcs().forEach(({pc,ti})=>{                          // pc: octave-reduced; ti: its chord-tone index
      const base=effKey()*pc;
      for(let o=Math.ceil(Math.log2(fLo/base)); o<=Math.floor(Math.log2(fHi/base)); o++){
        const f=base*Math.pow(2,o);
        pegs.push({ tone:ti, octave:o, f, y:latY(f), role:(ITV[CHORDS[state.chordIdx].r[ti]]||"?") });
      }
    });
    return pegs;
  }

  const latState={el:null, inner:null, pegs:[], drag:null};  // live lattice for the drag handlers
  const seqActive = () => seq.active>=0 && seq.active<seq.slots.length;   // is a chord focused?
  function renderVoicing(){
    voicingEl.innerHTML="";
    const active = seqActive();

    // .lattice fills the canvas height (see CSS); .latinner spans it, holding the whole pitch range
    const lat=document.createElement("div"); lat.className="lattice"+(active?"":" nulled");
    const inner=document.createElement("div"); inner.className="latinner";
    inner.innerHTML='<div class="lline"></div>';
    latState.el=lat; latState.inner=inner; latState.pegs=latticePegs();

    // which pitches the voices occupy, so we don't draw an empty peg under a voice
    const occ=new Map();                                    // fkey → [voice index,…]
    if(active) state.voicing.forEach((slot,k)=>{ const key=fkey(slotFreq(slot)); (occ.get(key)||occ.set(key,[]).get(key)).push(k); });

    // hollow pegs. When a chord is focused each carries a grayed chord-tone label (a named drop target);
    // in the null case the lattice is just a grayed, label-less scaffold.
    latState.pegs.forEach(p=>{
      if(occ.has(fkey(p.f))) return;                        // occupied → the voice row draws it instead
      const row=document.createElement("div"); row.className="lrow lpeg"; row.style.top=p.y.toFixed(2)+"%";
      row.dataset.f=fkey(p.f);
      row.innerHTML=`<span></span><span class="ldots"><span class="pegdot"></span></span>`+
                    (active?`<span class="linfo"><b class="peglab">${p.role}</b></span>`:`<span></span>`);
      inner.appendChild(row);
    });

    // voices: one row per occupied pitch. A doubled pitch shows both parts + tangent dots + one label.
    occ.forEach((ks,key)=>{
      const rep=state.voicing[ks[0]];
      const ratio=CHORDS[state.chordIdx].r[rep.tone], role=ITV[ratio]||ratio, col=toneColor(role);
      const keyDeg=DEGREES[(Math.round(12*Math.log2(state.absPcs[rep.tone]))%12+12)%12].lab;
      const f=slotFreq(rep);
      const row=document.createElement("div"); row.className="lrow lvoice"; row.style.top=latY(f).toFixed(2)+"%";
      row.dataset.f=key;
      const parts=ks.map(k=>`<span class="lpart" style="color:${col}">${VOICE_NAMES[k]}</span>`).join("");
      const dots =ks.map(k=>`<span class="ldot" draggable="false" data-k="${k}" style="background:${col}"></span>`).join("");
      row.innerHTML=`<span class="lparts">${parts}</span>`+
                    `<span class="ldots">${dots}</span>`+
                    `<span class="linfo"><b style="color:${col}">${role}</b><i>${keyDeg}</i><em>${noteName(f)}</em></span>`;
      inner.appendChild(row);
    });

    lat.appendChild(inner);
    inner.querySelectorAll(".ldot").forEach(d=>d.addEventListener("pointerdown",startDotDrag));
    voicingEl.appendChild(lat);
  }

  // ---- drag a voice dot onto a peg (the only voicing edit) -------------------------------------
  // The dragged dot keeps its part; dropping sets that part's chord tone + octave to the target peg,
  // so its function (and colour) update. A pitch already holding MAX_PER_PITCH other voices is refused.
  function nearestPeg(clientY){
    const r=latState.inner.getBoundingClientRect();          // maps a peg's % position to a screen Y
    let best=null, bd=Infinity;
    latState.pegs.forEach(p=>{ const d=Math.abs((r.top + p.y/100*r.height)-clientY); if(d<bd){ bd=d; best=p; } });
    return best;
  }
  function occupancyAt(key, exceptK){                       // how many OTHER voices sit on this pitch
    let n=0; state.voicing.forEach((s,k)=>{ if(k!==exceptK && fkey(slotFreq(s))===key) n++; }); return n;
  }
  function highlight(peg, ok){
    latState.el.querySelectorAll(".target,.bad").forEach(e=>e.classList.remove("target","bad"));
    if(!peg) return;
    const row=latState.el.querySelector(`.lrow[data-f="${fkey(peg.f)}"]`);
    const dots=row && row.querySelector(".ldots");
    if(dots){ dots.classList.add("target"); if(!ok) dots.classList.add("bad"); }
  }
  function startDotDrag(e){
    e.preventDefault(); e.stopPropagation();
    const dot=e.currentTarget;
    latState.drag={k:+dot.dataset.k, pid:e.pointerId, peg:null, dot, y0:e.clientY};
    try{ dot.setPointerCapture(e.pointerId); }catch(_){}
    dot.classList.add("grabbing");
    latState.el.classList.add("dragging");
  }
  window.addEventListener("pointermove",e=>{
    const d=latState.drag; if(!d) return;
    d.dot.style.transform=`translateY(${(e.clientY-d.y0).toFixed(0)}px) scale(1.25)`;   // dot trails the finger
    const peg=nearestPeg(e.clientY);
    const ok=peg && occupancyAt(fkey(peg.f), d.k) < MAX_PER_PITCH;
    d.peg=ok ? peg : null;
    highlight(peg, ok);
  });
  window.addEventListener("pointerup",()=>{
    const d=latState.drag; if(!d) return;
    latState.drag=null;
    if(d.peg){ const s=state.voicing[d.k]; s.tone=d.peg.tone; s.octave=d.peg.octave; applyFreqs(); }
    renderVoicing();                                        // redraw (also clears drag styling / snaps back)
  });
  window.addEventListener("pointercancel",()=>{ if(latState.drag){ latState.drag=null; renderVoicing(); } });

  // ============================================================ voices + mixer strips
  const chartSvg=document.getElementById("chart");
  let activeDrag=null; // {kind:'chart'|'chartAll', ...}
  function buildVoice(k){
    voices.push({ formants: JSON.parse(JSON.stringify(DEFAULT_FORMANTS)), freq:state.keyFreq,
      muted:false, soloed:false, level:1, mode:"voice", srcExp:DEFAULT_SRCEXP, bwFrac:DEFAULT_BWFRAC });
  }

  // per-voice slider params shown in each strip. When "move: all voices" is on, dragging one
  // shifts all four by the same delta (preserving their spread), matching the chart's behavior.
  const PARAMS=[
    {key:"bright",lab:"bri",min:TYP_F0,max:TYP_F1,step:0.01,def:DEFAULT_SRCEXP,
      get:v=>v.srcExp, set:(v,x)=>v.srcExp=x,
      apply:v=>{ if(ctx&&state.playing&&v.osc&&v.mode==="voice") v.osc.setPeriodicWave(computeWave(v.freq,v.srcExp)); syncFormants(v); },
      fmt:v=>`${(-6*v.srcExp).toFixed(1)} dB/oct`},
    {key:"nasal",lab:"nas",min:TYP_B0,max:TYP_B1,step:0.001,def:DEFAULT_BWFRAC,
      get:v=>v.bwFrac, set:(v,x)=>v.bwFrac=x, apply:v=>syncFormants(v),
      fmt:v=>`${Math.round(v.bwFrac*100)}% bw`},
    {key:"f3",lab:"F3",min:1800,max:3000,step:10,def:2500,
      get:v=>v.formants[2].F, set:(v,x)=>v.formants[2].F=x, apply:v=>syncFormants(v),
      fmt:v=>`${Math.round(v.formants[2].F)} Hz`},
    // Level slider is in dB (log curve) so equal drags give equal loudness change; it spans its own
    // full-width row. Range is gain-staged (see MASTER_GAIN): 0 dB = unity = the top, so four voices at
    // max stay ~2 dB below clipping; -48 dB floor is ~the quietest audible level at full system volume.
    // v.level stays LINEAR gain (the stored quantity + wire format); only this get/set translate.
    {key:"vol",lab:"vol",min:-48,max:0,step:0.2,def:0,
      get:v=>v.level>0 ? 20*Math.log10(v.level) : -48,
      set:(v,x)=>v.level=Math.pow(10, x/20),
      apply:v=>{ if(ctx) v.voiceGain.gain.setTargetAtTime(isAudible(v)?v.level:0,ctx.currentTime,0.03); },
      fmt:v=>{ const dB=v.level>0?20*Math.log10(v.level):-48; return `${dB>=0?"+":""}${dB.toFixed(1)} dB`; }},
  ];
  function applyParam(p,v,val){
    const cv=clamp(val,p.min,p.max); p.set(v,cv); p.apply(v);
    const u=v.ui[p.key];
    if(parseFloat(u.sl.value)!==cv) u.sl.value=cv;
    u.pv.textContent=p.fmt(v);
    onStateEdit();   // per-voice sliders (bright/nasal/F3/vol/bend) + resets funnel through here
  }
  function onParamInput(p,k){
    const v=voices[k], nv=parseFloat(v.ui[p.key].sl.value);
    if(state.moveAll){ const d=nv-p.get(v); voices.forEach(w=>applyParam(p,w,p.get(w)+d)); }
    else applyParam(p,v,nv);
  }
  function resetParam(p,k){
    if(state.moveAll) voices.forEach(w=>applyParam(p,w,p.def)); else applyParam(p,voices[k],p.def);
  }
  //#region solo-mute — PURE, DOM-FREE: legal mute/solo transitions. Node-testable
  // (test/solo-mute.test.mjs slices this region out of the HTML and evals it.)
  //
  // Only two shapes are legal:
  //   no voice soloed  → any subset of the voices muted (0–4 mute buttons lit)
  //   one voice soloed → that voice unmuted and ALL others muted (1 solo + 3 mutes lit)
  //
  // So `muted` alone decides what is audible; `soloed` only records how we got there, which is
  // why deliberately hand-muting three voices does NOT light the fourth voice's solo button.
  const soloIndex = st => st.findIndex(s => s.soloed);

  // The mute pattern that a solo on voice `i` forces.
  const soloedStates = (n,i) => Array.from({length:n}, (_,k) => ({muted: k!==i, soloed: k===i}));

  // Clicking solo. `saved` carries the mute pattern from before the solo, so switching solo back
  // off restores what the user had rather than blanket-unmuting; null when nothing is soloed.
  function applySolo(st, i, saved){
    const cur = soloIndex(st);
    if(cur === i){                                    // solo off → put the old mutes back
      const m = saved || st.map(()=>false);
      return {states: st.map((s,k)=>({muted:!!m[k], soloed:false})), saved:null};
    }
    // solo on, or moved to a different voice — only snapshot on the way in, not when moving
    return {states: soloedStates(st.length,i), saved: cur === -1 ? st.map(s=>s.muted) : saved};
  }

  // Clicking mute. Always drops the solo, because every mute a user can reach from a soloed state
  // is otherwise illegal: muting the soloed voice leaves 4 mutes + a solo, unmuting any other
  // leaves fewer than 3. Per-voice, like solo: the move-all toggle governs moving sliders and the
  // vowel chart, not silencing voices.
  function applyMute(st, i){
    const on = !st[i].muted;
    return {states: st.map((s,k)=>({muted: k===i ? on : s.muted, soloed:false})), saved:null};
  }

  // Is this one of the two legal shapes above? (Used by the tests to check every transition.)
  function isLegalState(st){
    const i = soloIndex(st);
    if(i === -1) return true;
    return st.filter(s=>s.soloed).length === 1 && st.every((s,k)=>s.muted === (k!==i));
  }
  //#endregion solo-mute

  function setMuteUI(v){ v.ui.mute.classList.toggle("on",v.muted); v.ui.mute.textContent=v.muted?"muted":"mute"; }
  function setSoloUI(v){ v.ui.solo.classList.toggle("on",v.soloed); }
  // Legality is enforced above, so `muted` alone tells us what is heard.
  const isAudible = v => !v.muted;
  let preSoloMutes = null;                       // mutes to restore when solo is switched off
  const muteSoloStates = () => voices.map(v=>({muted:v.muted, soloed:v.soloed}));
  // Push a computed {muted,soloed} set onto the voices — either click can flip all four at once.
  function commitMuteSolo(res){
    preSoloMutes = res.saved;
    res.states.forEach((s,k)=>{
      const w=voices[k]; w.muted=s.muted; w.soloed=s.soloed; setMuteUI(w); setSoloUI(w);
    });
    refreshGains();
    onStateEdit();                           // solo moves mutes, and mutes are persisted
  }
  // Re-level every voice's gain to its current audibility.
  function refreshGains(){
    if(!ctx) return; const now=ctx.currentTime;
    voices.forEach(w=>w.voiceGain.gain.setTargetAtTime(isAudible(w)?w.level:0,now,0.03));
  }

  // one strip per voice (beside the chart): status line + bright/nasal/F3/vol/bend sliders + mute
  const stripsEl=document.getElementById("strips");
  function buildStrips(){
    stripsEl.innerHTML="";
    voices.forEach((v,k)=>{
      v.ui={};
      const col=VOICE_COLORS[k];
      const vparamHTML = p =>
        `<span class="vparam" data-p="${p.key}"><label>${p.lab}</label>`+
        `<input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.get(v)}" title="${p.lab} (double-click to reset)" style="accent-color:${col}">`+
        `<span class="pv"></span></span>`;
      const topRow = PARAMS.filter(p=>p.key!=="vol").map(vparamHTML).join("");
      const volRow = vparamHTML(PARAMS.find(p=>p.key==="vol"));
      const row=document.createElement("div"); row.className="vstrip";
      row.innerHTML=
        `<div class="vhd"><span class="nm" style="color:${col}">${VOICE_NAMES[k]}</span>`+
        `<span class="vinfo"></span><button class="solo">solo</button><button class="mute">mute</button></div>`+
        `<div class="params">${topRow}</div>`+
        `<div class="params volrow">${volRow}</div>`;
      stripsEl.appendChild(row);
      v.infoEl=row.querySelector(".vinfo");
      PARAMS.forEach(p=>{
        const sp=row.querySelector(`.vparam[data-p="${p.key}"]`);
        v.ui[p.key]={sl:sp.querySelector("input"), pv:sp.querySelector(".pv")};
        v.ui[p.key].sl.addEventListener("input",()=>onParamInput(p,k));
        v.ui[p.key].sl.addEventListener("dblclick",()=>resetParam(p,k));
        v.ui[p.key].pv.textContent=p.fmt(v);
      });
      // Both are per-voice regardless of move-all: ganging either is meaningless — muting all four
      // is just silence, and soloing all four is the same as soloing none.
      const mb=row.querySelector(".mute"); v.ui.mute=mb;
      mb.addEventListener("click",()=>commitMuteSolo(applyMute(muteSoloStates(), k)));
      const sb=row.querySelector(".solo"); v.ui.solo=sb;
      sb.addEventListener("click",()=>commitMuteSolo(applySolo(muteSoloStates(), k, preSoloMutes)));
      setMuteUI(v); setSoloUI(v);                // reflect state the strips were rebuilt from
      updateVoiceInfo(v);
    });
  }
  function updateVoiceInfo(v){
    if(!v.infoEl) return;
    v.infoEl.textContent=`${Math.round(v.freq)} Hz · ${noteName(v.freq)} · F1 ${Math.round(v.formants[0].F)} F2 ${Math.round(v.formants[1].F)}`;
  }

  function drawSharedChart(){
    let s="";
    s+=`<rect x="${CX0}" y="${CY0}" width="${CX1-CX0}" height="${CY1-CY0}" fill="#120c06" stroke="#5a4324" stroke-width="1"/>`;
    for(const t of [2200,1800,1400,1000]){
      const x=cxOfF2(t);
      s+=`<line x1="${x}" y1="${CY0}" x2="${x}" y2="${CY1}" stroke="#2c2010" stroke-width="1"/>`;
      s+=`<text x="${x}" y="${CY1+14}" fill="${GRAY_TXT}" font-size="9.5" text-anchor="middle">${t}</text>`;
    }
    for(const t of [300,400,500,600,700,800]){
      const y=cyOfF1(t);
      s+=`<line x1="${CX0}" y1="${y}" x2="${CX1}" y2="${y}" stroke="#2c2010" stroke-width="1"/>`;
      s+=`<text x="${CX0-6}" y="${y+3}" fill="${GRAY_TXT}" font-size="9.5" text-anchor="end">${t}</text>`;
    }
    s+=`<text x="${(CX0+CX1)/2}" y="${CY0-6}" fill="#ab8c57" font-size="10.5" text-anchor="middle">F2 — front ← → back</text>`;
    s+=`<text transform="translate(13,${(CY0+CY1)/2}) rotate(-90)" fill="#ab8c57" font-size="10.5" text-anchor="middle">F1 — close ↑ open ↓</text>`;
    // static reference vowels
    for(const vw of VOWELS){
      const cx=cxOfF2(vw.f2), cy=cyOfF1(vw.f1);
      s+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#a07f4c"/>`;
      s+=`<text x="${cx+5}" y="${cy+4}" fill="#c9b78f" font-size="11">${vw.ipa}</text>`;
    }
    // voice dots: size locked to voice index (voice 1 biggest), drawn back-to-front so every dot stays grabbable
    for(let k=0;k<voices.length;k++){
      const v=voices[k];
      const cx=cxOfF2(v.formants[1].F), cy=cyOfF1(v.formants[0].F);
      const r=12-k*2.2, col=VOICE_COLORS[k];
      s+=`<g data-vdot="${k}" style="cursor:grab">`;
      s+=`<circle cx="${cx}" cy="${cy}" r="16" fill="none" pointer-events="all"/>`;  // generous invisible touch target
      s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" fill-opacity="0.5" stroke="${col}" stroke-width="2"/>`;
      s+=`<text x="${cx}" y="${cy+3.5}" fill="#120c06" font-size="${Math.max(8,Math.round(r-1))}" font-weight="700" text-anchor="middle">${VOICE_TAGS[k]}</text></g>`;
    }
    chartSvg.innerHTML=s;
  }

  // ---- vowel-chart interaction (drag a voice's F1/F2; ⌘/Ctrl or "move: all" drags all four) ----
  function chartToF(clientX,clientY){
    const r=chartSvg.getBoundingClientRect();
    const x=(clientX-r.left)/r.width*CVBW, y=(clientY-r.top)/r.height*CVBH;
    return {
      f1: Math.exp(lF1LO+(y-CY0)/(CY1-CY0)*(lF1HI-lF1LO)),
      f2: Math.exp(lF2HI-(x-CX0)/(CX1-CX0)*(lF2HI-lF2LO)),
    };
  }
  function setFromChart(v,clientX,clientY){
    const {f1,f2}=chartToF(clientX,clientY);
    v.formants[0].F=clamp(f1, v.formants[0].min, v.formants[0].max);
    v.formants[1].F=clamp(f2, v.formants[1].min, v.formants[1].max);
    updateVoiceInfo(v); drawSharedChart(); syncFormants(v);
    onStateEdit();
  }
  chartSvg.addEventListener("pointerdown",e=>{
    const dot=e.target.closest("[data-vdot]");
    if(!dot) return;
    if(e.metaKey||e.ctrlKey||state.moveAll){
      const st=chartToF(e.clientX,e.clientY);
      activeDrag={kind:"chartAll", startF1:st.f1, startF2:st.f2,
        base:voices.map(v=>({f1:v.formants[0].F, f2:v.formants[1].F}))};
    } else {
      activeDrag={kind:"chart", v:voices[+dot.dataset.vdot]};
    }
    e.preventDefault();
  });
  window.addEventListener("pointermove",e=>{
    if(!activeDrag) return;
    if(activeDrag.kind==="chartAll"){
      const cur=chartToF(e.clientX,e.clientY);
      // ratio (not difference) so the slide is rigid in log-log space: every voice's
      // F1/F2 scales by the same factor, holding the chord's formant ratios constant.
      const r1=cur.f1/activeDrag.startF1, r2=cur.f2/activeDrag.startF2;
      voices.forEach((v,k)=>{
        v.formants[0].F=clamp(activeDrag.base[k].f1*r1, v.formants[0].min, v.formants[0].max);
        v.formants[1].F=clamp(activeDrag.base[k].f2*r2, v.formants[1].min, v.formants[1].max);
        updateVoiceInfo(v); syncFormants(v);
      });
      drawSharedChart();
      onStateEdit();
    } else {
      setFromChart(activeDrag.v, e.clientX, e.clientY);
    }
  });
  window.addEventListener("pointerup",()=>{ activeDrag=null; });

  // ============================================================ global timbre controls
  const vibEl=document.getElementById("vib"), vibVal=document.getElementById("vibval");
  // Jitter & shimmer are global on/off toggles (tickHuman reads state.jitterCents/state.shimmer live);
  // "on" = the default magnitude, "off" = 0. The save-state codec still carries the numeric values.
  const jitBtn=document.getElementById("jit"), shimBtn=document.getElementById("shim");
  jitBtn.addEventListener("click",()=>{
    const on=!jitBtn.classList.contains("on");
    jitBtn.classList.toggle("on",on); jitBtn.textContent=on?"on":"off";
    state.jitterCents=on?JITTER_AMT:0; onStateEdit();
  });
  shimBtn.addEventListener("click",()=>{
    const on=!shimBtn.classList.contains("on");
    shimBtn.classList.toggle("on",on); shimBtn.textContent=on?"on":"off";
    state.shimmer=on?SHIMMER_AMT:0; onStateEdit();
  });

  function lab(){
    vibVal.textContent=state.vibCents<=0?"off":`±${state.vibCents}¢`;
  }
  vibEl.addEventListener("input",()=>{ state.vibCents=parseFloat(vibEl.value); lab();
    if(ctx) voices.forEach(v=>v.vibDepth&&v.vibDepth.gain.setTargetAtTime(state.vibCents,ctx.currentTime,0.02)); onStateEdit(); });

  // No audio without a sequenced chord: Play sounds the focused slot (there's always one unless the
  // user has deleted every chord).
  playBtn.addEventListener("click",()=>{ if(state.playing) stopAll(); else if(seq.slots.length) playAll(); });

  // just ↔ 12-ET toggle: keep the current voicing, just retune the chord's internal intervals
  const tuningBtn=document.getElementById("tuning");
  tuningBtn.addEventListener("click",()=>{
    state.et=!state.et;
    tuningBtn.classList.toggle("on",!state.et);   // lit = just intonation (ring mode)
    tuningBtn.textContent=state.et?"12-ET":"Just";
    computeAbsPcs();
    applyFreqs();      // retune the sounding voices and recompute the implied fundamental
    renderVoicing();   // refresh the displayed note names / cents
  });

  // move-one / move-all toggle (lets touch users drag all vowels in unison without a modifier key)
  const moveAllBtn=document.getElementById("moveall");
  moveAllBtn.addEventListener("click",()=>{
    state.moveAll=!state.moveAll;
    moveAllBtn.classList.toggle("on",state.moveAll);
    moveAllBtn.textContent=state.moveAll?"move: all voices":"move: one voice";
    onStateEdit();
  });

  // ============================================================ save state (URL <-> app)
  // DOM-aware glue around the pure state-codec region. The live app is the single source of
  // truth for defaults (appDefaults), so the codec never hard-codes app constants.
  const PBYKEY = Object.fromEntries(PARAMS.map(p => [p.key, p]));
  function appDefaults(){
    const dv = { bri:DEFAULT_SRCEXP, nas:DEFAULT_BWFRAC, f3:2500, lvl:1, bend:0,
                 mode:"voice", mute:false,
                 f1:DEFAULT_FORMANTS[0].F, f2:DEFAULT_FORMANTS[1].F };
    // mirrors the initial `state` values above; these are the wire-format defaults.
    return { key:220, root:0, chord:1, et:false, moveAll:true,
             vib:3, jit:4, shim:0.04, vol:MASTER_GAIN,
             voices:[0,1,2,3].map(() => ({...dv})) };
  }
  function readSnapshot(){
    return {
      v: SCHEMA_VERSION,
      key: state.keyFreq, root: state.rootIdx, chord: state.chordIdx,
      et: state.et, moveAll: state.moveAll,
      vib: state.vibCents, jit: state.jitterCents, shim: state.shimmer, vol: state.volume,
      voicing: state.voicing.map(s => [s.tone, s.octave]),
      voices: voices.map(v => ({
        bri:v.srcExp, nas:v.bwFrac, f3:v.formants[2].F,
        // bend is global now, but the wire format has a per-voice bend float — store the global
        // in every voice so the codec is unchanged and older per-voice URLs still round-trip.
        lvl:v.level, bend:state.bendCents, mode:v.mode, mute:v.muted,
        f1:v.formants[0].F, f2:v.formants[1].F,
      })),
    };
  }
  function applySnapshot(raw){
    const snap = normalizeSnapshot(raw, appDefaults());
    suppressSync = true;
    try {
      setKeyFromFreq(snap.key);   // stored as a frequency → nearest dial note (bend restored separately below)
      state.rootIdx  = clamp(snap.root,  0, DEGREES.length-1);
      state.chordIdx = clamp(snap.chord, 0, CHORDS.length-1);
      markSel(chordsEl, state.chordIdx);

      state.et = snap.et;
      tuningBtn.classList.toggle("on", !state.et);
      tuningBtn.textContent = state.et ? "12-ET" : "Just";

      state.moveAll = snap.moveAll;
      moveAllBtn.classList.toggle("on", state.moveAll);
      moveAllBtn.textContent = state.moveAll ? "move: all voices" : "move: one voice";

      // master volume has no slider — it's pinned; ignore any stored vol so gain-staging always holds
      state.volume = MASTER_GAIN;
      vibEl.value = snap.vib;  state.vibCents = parseFloat(vibEl.value);  // set slider, read back to clamp
      // jitter/shimmer are on/off toggles now — any stored positive amount reads as "on" (at the default magnitude)
      const jitOn = snap.jit > 0, shimOn = snap.shim > 0;
      state.jitterCents = jitOn ? JITTER_AMT   : 0;
      state.shimmer     = shimOn ? SHIMMER_AMT : 0;
      jitBtn.classList.toggle("on", jitOn);   jitBtn.textContent  = jitOn  ? "on" : "off";
      shimBtn.classList.toggle("on", shimOn); shimBtn.textContent = shimOn ? "on" : "off";
      lab();
      if(ctx) voices.forEach(v => v.vibDepth && v.vibDepth.gain.setTargetAtTime(state.vibCents, ctx.currentTime, 0.02));
      // solo is a live control, not persisted — a load lands on "mutes, no solo", always legal
      voices.forEach(v => { v.soloed = false; if(v.ui && v.ui.solo) setSoloUI(v); });
      preSoloMutes = null;                      // the pre-solo mutes belong to the old state

      // global bend: stored redundantly per voice — take the first (all equal for new saves)
      state.bendCents = clamp(snap.voices[0].bend, -100, 100);
      drawKeyDial(); drawRootDial();   // reflect key/bend/root on the dials; applyFreqs() at the end applies it to every voice

      snap.voices.forEach((sv,k) => {
        const v = voices[k];
        v.mode = sv.mode;
        v.formants[0].F = clamp(sv.f1, v.formants[0].min, v.formants[0].max);
        v.formants[1].F = clamp(sv.f2, v.formants[1].min, v.formants[1].max);
        applyParam(PBYKEY.bright, v, sv.bri);      // routed through applyParam so each value is
        applyParam(PBYKEY.nasal,  v, sv.nas);      // clamped to its slider range and the strip UI
        applyParam(PBYKEY.f3,     v, sv.f3);       // + readouts stay in sync
        applyParam(PBYKEY.vol,    v, sv.lvl>0 ? 20*Math.log10(sv.lvl) : PBYKEY.vol.min);  // lvl stored linear → dB
        v.muted = sv.mute; setMuteUI(v);
        if(ctx) v.voiceGain.gain.setTargetAtTime(isAudible(v)?v.level:0, ctx.currentTime, 0.03);
        applyOscType(v); syncFormants(v);
      });

      computeAbsPcs();
      const nT = CHORDS[state.chordIdx].r.length;
      const vc = snap.voicing
        .filter(s => s.tone>=0 && s.tone<nT)
        .map(s => ({tone:s.tone, octave:clamp(s.octave, -6, 6)}));
      state.voicing = (vc.length === voices.length) ? vc : defaultVoicing(state.absPcs);
      applyFreqs(); renderVoicing(); drawSharedChart();
    } finally {
      suppressSync = false;
    }
  }

  // State lives in the sequence JSON (copy/download/upload) + a localStorage autosave — not the URL.
  // Every intent-changing action funnels through onStateEdit(), which mirrors the live app into the
  // active slot. `ready` gates it until init finishes; `suppressSync` gates it during a load/step.
  let ready = false, suppressSync = false;
  function onStateEdit(){
    if(!ready || suppressSync) return;
    seqCaptureActive();   // write the live state back into the active slot (+ autosave, inside)
  }

  // ============================================================ sequencer
  // A sequence is an ordered list of full snapshots (readSnapshot() objects). Each slot carries the
  // COMPLETE quartet state — timbre included — because the whole point of the tool is studying how
  // balance/timbre must shift between chords. Stepping to a slot is applySnapshot() (which retunes the
  // sounding voices in place); editing the app writes the live state back into the active slot via
  // seqCaptureActive(), hung off onStateEdit(). Persistence is a JSON document you copy/download/
  // upload; the sequence also autosaves to localStorage so a reload doesn't lose an unsaved progression.
  const SEQ_DOC = "quartet-seq", SEQ_LS_KEY = "quartet-seq-v1";
  const seq = { slots: [], active: -1 };
  const seqbarEl  = document.getElementById("seqbar");
  const chordEditorEl = document.getElementById("chordeditor");
  const glideEl   = document.getElementById("glide"), glideValEl = document.getElementById("glideval");
  const jsonBoxEl = document.getElementById("seqjson");
  const musicTables = { DEGREES, CHORDS, ITV, rval, octRed };
  const readGlide = () => parseFloat(glideEl.value) || 0;
  const fmtGlide  = s => s<=0 ? "0 ms" : s<1 ? Math.round(s*1000)+" ms" : s.toFixed(2)+" s";

  function slotChipHTML(snap){
    return chipRows(snap, musicTables)
      .map(r => `<b title="${r.role}" style="color:${toneColor(r.role)}">${r.deg}</b>`).join("");
  }
  function chordNameOf(snap){
    return romanOf(snap.root|0) + " " + (CHORDS[snap.chord]||CHORDS[0]).name;
  }
  function renderSeq(){
    seqbarEl.innerHTML = "";
    seq.slots.forEach((snap,i) => {
      const el = document.createElement("div");
      el.className = "slot" + (i===seq.active ? " sel" : "");
      el.dataset.i = i;
      el.innerHTML = `<span class="idx">${i+1}</span><div class="stack">${slotChipHTML(snap)}</div>`
                   + `<span class="cname">${chordNameOf(snap)}</span>`
                   + `<button class="del" title="Delete this chord">✕</button>`;
      seqbarEl.appendChild(el);
    });
    const add = document.createElement("div");
    add.className = "slot seqadd"; add.title = "Add a chord (copies the current one)"; add.textContent = "＋";
    seqbarEl.appendChild(add);
    if(!seq.slots.length){
      const hint = document.createElement("span");
      hint.className = "seqhint"; hint.textContent = "Add a chord to start a sequence.";
      seqbarEl.appendChild(hint);
    }
    updateEditor(); updatePlayEnabled(); syncJsonBox();
  }
  const realSlots  = () => [...seqbarEl.querySelectorAll(".slot:not(.seqadd)")];
  function markSeqSel(){
    const boxes = realSlots();
    boxes.forEach((b,i)=>b.classList.toggle("sel", i===seq.active));
    if(boxes[seq.active]) boxes[seq.active].scrollIntoView({block:"nearest", inline:"nearest"});
  }
  // The editor (wheels + vocabulary) appears only when a slot is focused. The voicing lattice stays
  // ALWAYS visible in a fixed spot left of the canvas — it just renders as a grayed, label-less
  // scaffold in the null case — so the canvas width never shifts. Re-render it to flip active↔null.
  function updateEditor(){
    const on = seq.active>=0 && seq.active<seq.slots.length;
    chordEditorEl.hidden = !on;
    renderVoicing();
  }
  // No audio without a sequenced chord: Play is dead when the sequence is empty.
  function updatePlayEnabled(){
    const has = seq.slots.length>0;
    playBtn.disabled = !has;
    if(!has && state.playing) stopAll();
  }
  // The key center is global to the whole sequence: pushing it on the dial rewrites every slot's key.
  function syncKeyAcrossSlots(){
    if(!ready) return;
    seq.slots.forEach(s=>{ s.key = state.keyFreq; if(Array.isArray(s.voices)) s.voices.forEach(v=>{ v.bend = state.bendCents; }); });
    syncJsonBox(); scheduleAutosave();
  }

  function seqStep(i){
    if(i<0 || i>=seq.slots.length) return;
    seq.active = i;
    stepGlide = readGlide();                                       // portamento only for this step
    try { applySnapshot(seq.slots[i]); } finally { stepGlide = null; }
    markSeqSel(); updateEditor(); scheduleAutosave();
  }
  function seqAdd(){
    const at = seq.active>=0 ? seq.active+1 : seq.slots.length;    // insert just after the current chord
    seq.slots.splice(at, 0, readSnapshot());
    seq.active = at;
    renderSeq(); scheduleAutosave();
  }
  function seqRemove(i){
    if(i<0 || i>=seq.slots.length) return;
    const wasActive = i===seq.active;
    seq.slots.splice(i,1);
    if(seq.active > i) seq.active--;
    else if(seq.active === i) seq.active = Math.min(i, seq.slots.length-1);   // → neighbor, or -1 if empty
    renderSeq();
    if(wasActive && seq.active>=0){ stepGlide=readGlide(); try{ applySnapshot(seq.slots[seq.active]); } finally{ stepGlide=null; } }
    scheduleAutosave();
  }
  function seqReorder(from,to){
    const keep = seq.slots[seq.active];                           // track the active slot by identity
    if(to>from) to--;
    const [m] = seq.slots.splice(from,1);
    seq.slots.splice(clamp(to,0,seq.slots.length),0,m);
    seq.active = seq.slots.indexOf(keep);
    renderSeq(); scheduleAutosave();
  }
  // Writeback: mirror the live app state into the active slot + refresh just that chip (called on
  // every edit via onStateEdit). Guarded so it no-ops with no active slot or during a load/step.
  function seqCaptureActive(){
    if(seq.active<0 || seq.active>=seq.slots.length) return;
    seq.slots[seq.active] = readSnapshot();
    const el = seqbarEl.querySelector(`.slot[data-i="${seq.active}"]`);
    if(el){
      el.querySelector(".stack").innerHTML = slotChipHTML(seq.slots[seq.active]);
      el.querySelector(".cname").textContent = chordNameOf(seq.slots[seq.active]);
    }
    updateEditor();   // keep the editor's "Chord N · <name>" title in step with in-editor changes
    syncJsonBox(); scheduleAutosave();
  }

  // ---- drag-to-reorder / tap-to-step (pointer events; HTML5 DnD never fires on touch) ----
  let sdrag=null;
  function seqInsertIndex(clientX){
    const boxes=realSlots();
    for(let i=0;i<boxes.length;i++){ const r=boxes[i].getBoundingClientRect(); if(clientX < r.left + r.width/2) return i; }
    return boxes.length;
  }
  const markSeqOver  = ins => realSlots().forEach((b,i)=>b.classList.toggle("over", i===ins));
  const clearSeqOver = ()  => realSlots().forEach(b=>b.classList.remove("over"));
  seqbarEl.addEventListener("pointerdown", e=>{
    const slot = e.target.closest(".slot");
    if(!slot || slot.classList.contains("seqadd") || e.target.closest(".del")) return;
    sdrag = {i:+slot.dataset.i, x0:e.clientX, y0:e.clientY, moved:false, el:slot};
    try{ slot.setPointerCapture(e.pointerId); }catch(_){}
  });
  seqbarEl.addEventListener("pointermove", e=>{
    if(!sdrag) return;
    if(!sdrag.moved && Math.hypot(e.clientX-sdrag.x0, e.clientY-sdrag.y0) < 6) return;
    sdrag.moved = true; sdrag.el.classList.add("drag"); markSeqOver(seqInsertIndex(e.clientX));
  });
  seqbarEl.addEventListener("pointerup", e=>{
    if(!sdrag) return;
    const d=sdrag; sdrag=null; d.el.classList.remove("drag"); clearSeqOver();
    if(d.moved) seqReorder(d.i, seqInsertIndex(e.clientX)); else seqStep(d.i);
  });
  seqbarEl.addEventListener("pointercancel", ()=>{ if(sdrag){ sdrag.el.classList.remove("drag"); clearSeqOver(); sdrag=null; } });
  seqbarEl.addEventListener("click", e=>{
    const del=e.target.closest(".del");
    if(del){ e.stopPropagation(); seqRemove(+del.closest(".slot").dataset.i); return; }
    if(e.target.closest(".seqadd")) seqAdd();
  });

  // ---- JSON document: copy / download / upload / paste, + localStorage autosave ----
  const seqDoc    = () => ({ app:SEQ_DOC, v:SCHEMA_VERSION, active:seq.active, slots:seq.slots });
  const seqToJSON = () => JSON.stringify(seqDoc(), null, 2);
  function syncJsonBox(){ if(jsonBoxEl && document.activeElement!==jsonBoxEl) jsonBoxEl.value = seqToJSON(); }
  let autosaveTimer=null;
  const scheduleAutosave = () => { clearTimeout(autosaveTimer); autosaveTimer=setTimeout(saveLS,400); };
  function saveLS(){ try{ localStorage.setItem(SEQ_LS_KEY, seqToJSON()); }catch(_){} }
  function loadDoc(obj){
    if(!obj || !Array.isArray(obj.slots)) throw new Error("not a sequence document");
    seq.slots = obj.slots.map(s => normalizeSnapshot(s, appDefaults()));
    seq.active = Number.isInteger(obj.active) ? clamp(obj.active,-1,seq.slots.length-1) : (seq.slots.length?0:-1);
    renderSeq();
    if(seq.active>=0){ stepGlide=readGlide(); try{ applySnapshot(seq.slots[seq.active]); } finally{ stepGlide=null; } }
    scheduleAutosave();
  }
  function restoreLS(){
    let raw; try{ raw=localStorage.getItem(SEQ_LS_KEY); }catch(_){ return; }
    if(raw){ try{ loadDoc(JSON.parse(raw)); }catch(_){ /* corrupt save → ignore */ } }
  }
  // First-run seed: one chord, so the app is never in a dead (nothing-to-play) state. V7 in B♭ —
  // key center B♭3, chord root on scale-degree 5, Dom7, root position (the quintessential ring chord).
  function seedDefault(){
    state.keyMidi = 58; state.keyFreq = midiToFreq(58); state.bendCents = 0;   // B♭3
    state.rootIdx = 7;                                                          // scale degree "5"
    const dom7 = CHORDS.findIndex(c=>c.name==="Dom7"); state.chordIdx = dom7<0 ? 1 : dom7;
    drawKeyDial(); drawRootDial(); recomputeChord(); markSel(chordsEl, state.chordIdx);
    seq.slots = [ readSnapshot() ]; seq.active = 0;
    renderSeq();
  }

  // ---- import a Great Tags plain-text export as a sequence ------------------------------------
  // Parsing + chord detection are pure (see #region tagimport). Here we turn each detected chord into
  // a full snapshot: default timbre everywhere (the user tunes/ring-maxes later), the tag's key, and a
  // close, register-centered voicing that keeps each part on the chord tone it actually sang.
  function keyNameToMidi(name){
    if(!name) return 58;                                       // fall back to B♭3
    const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[name[0].toUpperCase()];
    if(base==null) return 58;
    let pc = base; const acc = name.slice(1);
    if(acc==="#"||acc==="♯") pc++; else if(acc==="b"||acc==="♭") pc--;
    return 48 + (((pc%12)+12)%12);                             // octave 3, matching the seed's B♭3
  }
  // Reconstruct the VERBATIM octave of every voice as absolute MIDI. The plaintext gives only scale
  // degrees + octave arrows (↑/↓), so the register is implicit: seed the first chord as a close, no-crossing
  // stack (Bass<Bari<Lead<Tenor) centered near the key, then move each voice to the nearest note of its next
  // pitch class, applying any arrow as an octave override. Returns per chord [bass,bari,lead,tenor] MIDIs.
  function reconstructMidis(chords, keyMidi){
    const V = [[],[],[],[]];                                   // per tag voice (0=T,1=L,2=Ba,3=Bs)
    const p0 = chords[0].parts;
    let bs = keyMidi + p0[3];
    let ba = keyMidi + p0[2]; while(ba < bs) ba += 12;
    let ld = keyMidi + p0[1]; while(ld < ba) ld += 12;
    let tn = keyMidi + p0[0]; while(tn < ld) tn += 12;
    const shift = -12*Math.round(((bs+ba+ld+tn)/4 - keyMidi)/12);   // center the quartet near the key
    bs+=shift; ba+=shift; ld+=shift; tn+=shift;
    const prev = [tn, ld, ba, bs];                            // tag-voice order T,L,Ba,Bs
    V[0].push(tn); V[1].push(ld); V[2].push(ba); V[3].push(bs);
    for(let i=1;i<chords.length;i++){
      for(let v=0; v<4; v++){
        const base = keyMidi + chords[i].parts[v];
        let m = base + 12*Math.round((prev[v]-base)/12);      // nearest octave to the previous note
        m += 12*chords[i].arr[v];                             // ↑/↓ arrow = octave override
        V[v].push(m); prev[v] = m;
      }
    }
    return chords.map((_,i)=>[V[3][i], V[2][i], V[1][i], V[0][i]]);   // → app order bass..tenor
  }
  // Turn per-part absolute MIDIs into the app's {tone, octave} voicing for a detected chord.
  function voicingFromMidis(root, chord, midis, keyMidi){
    const rootRatio = rval(DEGREES[root].r);
    const absPcs = CHORDS[chord].r.map(t => octRed(rootRatio * rval(t)));
    const tonePC = ti => (((Math.round(12*Math.log2(absPcs[ti]))%12)+12)%12);
    return midis.map(m => {
      const pc = (((m - keyMidi)%12)+12)%12;
      let bi=0, bd=99;
      CHORDS[chord].r.forEach((_,ti)=>{ const d=Math.abs(((tonePC(ti)-pc+18)%12)-6); if(d<bd){ bd=d; bi=ti; } });
      return [bi, Math.round((m - keyMidi)/12 - Math.log2(absPcs[bi]))];
    });
  }
  function importTagText(text){
    const parsed = parseTag(text);
    if(!parsed.chords.length) return { ok:false, msg:"No chords found — paste a Great Tags plain-text export.", warnings:parsed.warnings };
    const keyMidi = keyNameToMidi(parsed.key), keyFreq = midiToFreq(keyMidi);
    const midis = reconstructMidis(parsed.chords, keyMidi);
    const D = appDefaults();
    let approx = 0;
    seq.slots = parsed.chords.map((ch,i) => {
      const det = detectChord(ch.parts, musicTables);
      if(!det.covers) approx++;                                // only count notes we couldn't represent at all
      return normalizeSnapshot({ key:keyFreq, root:det.root, chord:det.chord,
                                 voicing:voicingFromMidis(det.root, det.chord, midis[i], keyMidi) }, D);
    });
    seq.active = 0;
    renderSeq();
    stepGlide = readGlide(); try{ applySnapshot(seq.slots[0]); } finally{ stepGlide = null; }
    drawKeyDial(); drawRootDial();
    scheduleAutosave();
    return { ok:true, count:seq.slots.length, approx, key:parsed.key||"?", warnings:parsed.warnings };
  }

  // Copy to clipboard, robust on a bare file:// open (not a secure context, so navigator.clipboard is
  // unavailable there → fall back to a throwaway <textarea> + execCommand).
  async function copyText(txt){
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); return true; } }catch(_){}
    try{
      const ta=document.createElement("textarea"); ta.value=txt;
      ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
      ta.focus(); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok;
    }catch(_){ return false; }
  }
  document.getElementById("seqadd-top").addEventListener("click", seqAdd);
  // Clear the whole sequence → empty state (Play disabled, lattice grays out). Confirm first since
  // there's no undo and the autosave will overwrite the cleared sequence.
  document.getElementById("seqclear").addEventListener("click", ()=>{
    if(seq.slots.length && !confirm("Clear all chords from the sequence?")) return;
    seq.slots = []; seq.active = -1;
    if(state.playing) stopAll();
    renderSeq(); scheduleAutosave();
  });
  glideEl.addEventListener("input", ()=>{ glideValEl.textContent = fmtGlide(readGlide()); });
  // ← / → step through the sequence, unless a form control (a slider, etc.) has focus and wants them.
  // ← / → step through the sequence; SPACE steps forward too (repeatedly tapping walks the chords,
  // wrapping at the end) — this replaces spacebar play/pause. A focused form control keeps the keys.
  window.addEventListener("keydown", e=>{
    const isSpace = e.key===" " || e.code==="Space";
    if(e.key!=="ArrowLeft" && e.key!=="ArrowRight" && !isSpace) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT") return;
    if(!seq.slots.length){ if(isSpace) e.preventDefault(); return; }
    e.preventDefault();                                   // also stops space from clicking a focused button / scrolling
    const cur = seq.active<0 ? 0 : seq.active;
    if(isSpace) seqStep((cur+1) % seq.slots.length);      // forward, cyclic
    else        seqStep(clamp(cur + (e.key==="ArrowRight"?1:-1), 0, seq.slots.length-1));
  });

  // ---- the JSON window: one toggle opens it; Copy/Paste use the clipboard; edits apply on blur ----
  const jsonWin = document.getElementById("jsonwin");
  const jsonToggleBtn = document.getElementById("jsontoggle");
  const flashBtn = (btn,msg) => { const p=btn.textContent; btn.textContent=msg; setTimeout(()=>{ btn.textContent=p; }, 1200); };
  jsonToggleBtn.addEventListener("click", ()=>{
    jsonWin.hidden = !jsonWin.hidden;
    jsonToggleBtn.classList.toggle("on", !jsonWin.hidden);
    if(!jsonWin.hidden) syncJsonBox();   // fill with the current sequence when opened
  });
  // Load whatever is in the box into the app; returns true on success. Invalid JSON is left untouched.
  function tryLoadFromBox(){
    let doc; try{ doc = JSON.parse(jsonBoxEl.value); }catch(_){ return false; }
    try{ loadDoc(doc); return true; }catch(_){ return false; }
  }
  const jsonCopyBtn = document.getElementById("jsoncopy");
  jsonCopyBtn.addEventListener("click", async ()=>{
    flashBtn(jsonCopyBtn, (await copyText(jsonBoxEl.value || seqToJSON())) ? "Copied ✓" : "Copy failed");
  });
  const jsonPasteBtn = document.getElementById("jsonpaste");
  jsonPasteBtn.addEventListener("click", async ()=>{
    try{
      if(!navigator.clipboard || !navigator.clipboard.readText) throw 0;
      jsonBoxEl.value = await navigator.clipboard.readText();      // works over https (the hosted app)
      flashBtn(jsonPasteBtn, tryLoadFromBox() ? "Loaded ✓" : "Not valid JSON");
    }catch(_){
      jsonBoxEl.focus(); jsonBoxEl.select();                       // file:// / denied: let them ⌘V into the box
      flashBtn(jsonPasteBtn, "Press ⌘V / Ctrl-V");
    }
  });
  // pasting into the box (⌘V), or editing then clicking away, applies the JSON
  jsonBoxEl.addEventListener("paste", ()=> setTimeout(tryLoadFromBox, 0));
  jsonBoxEl.addEventListener("change", tryLoadFromBox);

  // ---- the tag-import window: paste a Great Tags text export, Import → builds the sequence ----
  const tagWin = document.getElementById("tagwin");
  const tagToggleBtn = document.getElementById("tagtoggle");
  const tagBoxEl = document.getElementById("tagbox");
  const tagMsgEl = document.getElementById("tagmsg");
  tagToggleBtn.addEventListener("click", ()=>{
    tagWin.hidden = !tagWin.hidden;
    tagToggleBtn.classList.toggle("on", !tagWin.hidden);
  });
  document.getElementById("tagpaste").addEventListener("click", async ()=>{
    try{
      if(!navigator.clipboard || !navigator.clipboard.readText) throw 0;
      tagBoxEl.value = await navigator.clipboard.readText();
    }catch(_){ tagBoxEl.focus(); tagBoxEl.select(); tagMsgEl.textContent = "Press ⌘V / Ctrl-V, then Import →"; tagMsgEl.style.color = "var(--muted)"; }
  });
  const tagWarnEl = document.getElementById("tagwarn");
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.getElementById("tagload").addEventListener("click", ()=>{
    const r = importTagText(tagBoxEl.value);
    tagMsgEl.textContent = r.ok
      ? `Imported ${r.count} chords in ${r.key}${r.approx ? ` · ${r.approx} approximated` : ""}.`
      : r.msg;
    tagMsgEl.style.color = r.ok ? "#2f7d45" : "#c0473a";
    const warns = r.warnings || [];
    tagWarnEl.hidden = warns.length===0;
    tagWarnEl.innerHTML = warns.length
      ? `<b>${warns.length} line${warns.length>1?"s":""} didn't parse cleanly</b>` + warns.map(w=>esc(w)).join("<br>")
      : "";
  });

  // ============================================================ init
  for(let k=0;k<4;k++) buildVoice(k);
  buildStrips();
  markSel(chordsEl,state.chordIdx);
  lab();
  drawKeyDial();
  drawRootDial();
  recomputeChord();
  drawSharedChart();
  // Restore the autosaved sequence (stepping to its active chord), or seed a first-run chord if there
  // is none, then arm state syncing so init itself never re-triggers a save. All persistence is the
  // JSON doc + this localStorage autosave.
  glideValEl.textContent = fmtGlide(readGlide());
  restoreLS();
  if(!seq.slots.length) seedDefault();
  renderSeq();
  ready = true;
})();
</script>
</body>
</html>
