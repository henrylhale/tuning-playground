<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbershop Quartet — JI Voice Synth</title>
<style>
  :root{
    --case:#bfa97f; --panel:#d9c7a1; --keycap:#e7d8b7; --keycap-hi:#f7eed7; --keycap-edge:#b39868;
    --display:#171008; --ink:#2c1e0e; --muted:#7d6743; --accent:#e26a10; --accent-deep:#b1500a;
    --amber:#ffb347; --line:#a98e62; --bezel-hi:#f3e8ce; --bezel-lo:#8f7649;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(140% 60% at 50% -10%, #cfbb91, var(--case) 65%);
    color:var(--ink);
    font:13px/1.45 "Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:14px; display:flex; flex-direction:column; gap:14px;
  }
  h3{font-size:10.5px;font-weight:800;color:var(--muted);margin:0 0 7px;text-transform:uppercase;letter-spacing:1px}
  .panel{background:linear-gradient(180deg,#e3d4af,#d2bf98);border:1px solid var(--bezel-lo);border-radius:5px;
    box-shadow:inset 0 1px 0 var(--bezel-hi),0 2px 7px rgba(60,40,15,.2);padding:14px}
  label{color:var(--muted);font-size:12px;font-weight:600}
  select{background:linear-gradient(180deg,var(--keycap-hi),var(--keycap));color:var(--ink);border:1px solid var(--bezel-lo);
    border-radius:4px;padding:6px 8px;font-size:13px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
  input[type=range]{width:120px;max-width:46vw;vertical-align:middle;accent-color:var(--accent)}
  input[type=range].bend{ width:78px; max-width:32vw; cursor:pointer }

  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ctl{display:flex;align-items:center;gap:8px}
  .val{color:var(--ink);font-size:12px;min-width:30px;font-weight:600}

  /* keycaps */
  button.play,.chip,.mute,.solo,.wave,.octbtns button,.toggle{
    appearance:none;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:700;
    background:linear-gradient(180deg,var(--keycap-hi),var(--keycap) 55%,var(--keycap-edge));
    border:1px solid var(--bezel-lo);border-radius:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 var(--keycap-edge),0 2px 4px rgba(60,40,15,.22);
    transition:transform .06s,box-shadow .06s,filter .1s}
  button.play:hover,.chip:hover,.mute:hover,.solo:hover,.wave:hover,.octbtns button:hover,.toggle:hover{filter:brightness(1.05)}
  button.play:active,.chip:active,.mute:active,.solo:active,.wave:active,.octbtns button:active,.toggle:active{
    transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(60,40,15,.4)}
  button.play{padding:9px 18px;font-size:14px}
  button.play:disabled{opacity:.4;filter:grayscale(.5);cursor:not-allowed;transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .chip{padding:5px 8px;font-size:12px;min-width:30px;text-align:center}
  .grid .chip{font-size:11px;padding:6px 4px}
  .mute{color:var(--muted);padding:4px 9px;font-size:11px}
  .solo{color:var(--muted);padding:4px 9px;font-size:11px}
  .wave{color:var(--muted);padding:4px 8px;font-size:11px}
  .toggle{padding:5px 11px;font-size:11px}
  /* lit state */
  button.play.on,.chip.sel,.wave.on,.toggle.on{
    background:linear-gradient(180deg,#ffbf6f,var(--accent) 60%,var(--accent-deep));
    color:#2a1400;border-color:var(--accent-deep);
    box-shadow:inset 0 1px 0 rgba(255,231,195,.6),0 0 11px rgba(226,106,16,.5),0 2px 0 var(--accent-deep)}
  .mute.on{background:linear-gradient(180deg,#e98a7a,#c0473a);color:#fff0ec;border-color:#9c3327;
    box-shadow:inset 0 1px 0 rgba(255,200,190,.5),0 0 9px rgba(192,71,58,.5),0 2px 0 #9c3327}
  .solo.on{background:linear-gradient(180deg,#a9e6b4,#43a35e 60%,#2f7d45);color:#08240f;border-color:#2f7d45;
    box-shadow:inset 0 1px 0 rgba(210,255,220,.5),0 0 9px rgba(67,163,94,.5),0 2px 0 #2f7d45}

  #keydial,#rootdial{max-width:100%;height:auto;display:block;cursor:grab;touch-action:none;
    -webkit-tap-highlight-color:transparent}
  #keydial:active,#rootdial:active{cursor:grabbing}
  #keydial text,#rootdial text{user-select:none;-webkit-user-select:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:4px}

  /* voicing lattice: a vertical pitch axis you SPELL on. Every chord tone across the reasonable
     octaves is a peg (hollow dot + grayed function label) = a place to drop a voice. The four voices
     sit on four pegs; drag a coloured dot to another peg to re-spell. Two voices may double one pitch
     → their dots are drawn tangent. Same 3-column grid for every row (parts | dot(s) | function/key/
     note) so pegs and voices align on the center line. */
  /* the lattice fills the full height of its column (which stretches to the canvas), and .latinner
     spans it, so the whole pitch range always runs top-to-bottom the same regardless of chord */
  .lattice{position:relative;flex:1 1 auto;min-height:300px;overflow:hidden;touch-action:none}
  .lattice.nulled{opacity:.4;filter:grayscale(.6)}          /* no chord focused → grayed, label-less scaffold */
  .latinner{position:relative;width:100%;height:100%}
  .lattice .lline{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);
    background:linear-gradient(180deg,#00000012,#0000002e 8%,#0000002e 92%,#00000012)}
  .lattice .lrow{position:absolute;left:0;right:0;transform:translateY(-50%);pointer-events:none;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:9px}
  .lattice .lparts{justify-self:end;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
  .lattice .lpart{font-size:11px;font-weight:800;text-transform:capitalize;letter-spacing:.3px;white-space:nowrap}
  .lattice .ldots{justify-self:center;display:flex;align-items:center}       /* tangent dots when doubled */
  .lattice .ldot{width:16px;height:16px;border-radius:50%;box-sizing:border-box;pointer-events:auto;
    cursor:grab;touch-action:none;border:1.5px solid #ffffffb0;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .lattice .ldot.grabbing{cursor:grabbing;transform:scale(1.25);box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .lattice .pegdot{width:11px;height:11px;border-radius:50%;box-sizing:border-box;
    background:#0000000d;border:1.5px solid #00000045}
  .lattice .ldots.target .pegdot{border-color:var(--accent);background:#e26a1033;transform:scale(1.3)}
  .lattice .ldots.target .ldot{box-shadow:0 0 0 3px #e26a1066}
  .lattice .ldots.target.bad .pegdot{border-color:#c0473a;background:#c0473a33}
  .lattice .ldots.target.bad .ldot{box-shadow:0 0 0 3px #c0473a66}
  .lattice .linfo{justify-self:start;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  .lattice .linfo b{font-size:15px;font-weight:800;color:#3a2c17}
  .lattice .linfo b.peglab{color:#00000038;font-weight:800}   /* grayed function label on an empty peg */
  .lattice .linfo i{font-style:normal;font-size:12px;font-weight:700;color:#7a6132}
  .lattice .linfo em{font-style:normal;font-size:11px;color:#8a7038;font-variant-numeric:tabular-nums}
  .lattice.dragging{cursor:grabbing}

  /* sequencer: a strip of chord "chips" you step between; the app below edits the active one */
  .seqhd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .seqhd .grow{flex:1}
  /* JSON, then the [lattice | canvas] stage, then the focused chord's editor — stacked top to bottom */
  .seqmain{display:flex;flex-direction:column;gap:14px}
  /* the stage: a slim vertical lattice pinned to the left, the black canvas taking all the rest. The
     lattice column stretches to the canvas's height so the lattice is always exactly as tall as it. */
  .stage{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
  .stage .vcol{flex:0 0 234px;min-width:210px;display:flex;flex-direction:column}
  #seqcanvas{flex:1 1 460px;min-width:300px}
  .chordeditor{width:100%;padding:12px;border-radius:6px;
    background:linear-gradient(180deg,#e7d8b7,#d8c69f);border:1px solid var(--bezel-lo);
    box-shadow:inset 0 1px 0 var(--bezel-hi)}
  .chordeditor[hidden]{display:none}
  /* editor: big key + root wheels on the left (where the lattice used to be), chord vocabulary right */
  .edcols{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .dials{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .dials.big{flex:1 1 480px}
  .dials.big #keydial,.dials.big #rootdial{width:232px}
  #chords.grid.big{flex:1 1 300px}
  .grid.big{grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:6px}
  .grid.big .chip{font-size:13px;padding:10px 6px}
  /* the black stage: a full-width rounded viewport. A stack of four analysis lanes sits on top
     (audio waveform, synth waveform, audio spectrogram, synth spectrogram), the chord tiles below. */
  .seqcanvas{background:#0c0702;border:1px solid #120c06;border-radius:8px;padding:12px;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.7),inset 0 0 0 2px #0a0602,0 1px 0 var(--bezel-hi);
    display:flex;flex-direction:column;gap:10px}
  .cliplbl{align-self:flex-end;font-size:10px;color:#7d6743;margin:-2px 2px -6px}
  .lanes{display:flex;flex-direction:column;gap:8px}
  /* one analysis lane. The two synth lanes hold live canvases; the two audio lanes are placeholders
     (Milestone 2's imported recording) — a dashed empty screen with a flat baseline. */
  .lane{position:relative;height:80px;border-radius:5px;border:1px solid #241a0d;background:#0a0602;overflow:hidden}
  .lane.placeholder{border-style:dashed;border-color:#33260f}
  .lane.placeholder.wf::before{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1px solid #1b1409}
  .lane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .lanelab{position:absolute;top:5px;left:8px;z-index:1;font-size:9px;letter-spacing:.4px;
    text-transform:uppercase;color:#6b5730;pointer-events:none}
  /* extra padding so the selected tile's glow + the delete ✕ (which pokes outside the tile) aren't
     clipped by the horizontal-scroll container */
  .seqbar{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;overflow-y:hidden;padding:14px 12px}
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;
    background:linear-gradient(180deg,#241a0d,#181007);border:1px solid #3a2c17;border-radius:5px;
    padding:7px 9px 6px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,220,150,.06),0 1px 3px rgba(0,0,0,.5);
    min-width:40px;-webkit-user-select:none;user-select:none;touch-action:none}
  .slot.drag{opacity:.4}
  .slot.over{outline:2px dashed var(--accent);outline-offset:2px}
  .slot.sel{outline:2px solid var(--accent);outline-offset:0;box-shadow:inset 0 2px 7px rgba(0,0,0,.5),0 0 11px rgba(226,106,16,.55)}
  .slot .stack{display:flex;flex-direction:column;align-items:center;line-height:1.18}
  .slot .stack b{font-size:15px;font-weight:800;color:#f3e3bf}
  .slot .cname{font-size:9px;color:#a98a55;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
  .slot .del{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;border:1px solid #9c3327;
    background:#c0473a;color:#fff0ec;font-size:11px;line-height:14px;text-align:center;cursor:pointer;
    display:none;padding:0;font-weight:700}
  .slot:hover .del,.slot.sel .del{display:block}
  .slot .idx{font-size:8px;color:#6f5a38;letter-spacing:.5px}
  .slot.seqadd{background:none;border:1px dashed #4a3820;box-shadow:none;align-self:stretch;
    align-items:center;justify-content:center;min-width:44px;font-size:20px;color:#7d6743}
  .slot.seqadd:hover{border-color:var(--accent);color:var(--amber)}
  .seqhint{align-self:center;font-size:11px;color:#7d6743;font-style:italic}
  /* the JSON window: one toggle button opens it; Copy/Paste along its top talk to the clipboard */
  .jsonwin{margin-top:12px;padding:10px;border-radius:6px;border:1px solid var(--bezel-lo);
    background:linear-gradient(180deg,#e7d8b7,#d8c69f);box-shadow:inset 0 1px 0 var(--bezel-hi)}
  .jsonwin[hidden]{display:none}
  .jsonwin-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .jsonwin-title{margin-right:auto;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .tagmsg{font-size:11px;font-weight:600;margin-right:8px}
  .tagwarn{margin-top:8px;padding:8px 10px;border-radius:4px;background:#f6e2c2;border:1px solid #d8a24a;
    color:#7a4a12;font-size:11px;line-height:1.5}
  .tagwarn[hidden]{display:none}
  .tagwarn b{display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;font-size:10px}
  .jsonwin textarea{width:100%;height:120px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;
    background:var(--display);color:#c9b78f;border:1px solid var(--bezel-lo);border-radius:4px;padding:6px;resize:vertical}
  .waves{display:flex;gap:4px;flex-wrap:wrap}
  /* per-voice strips, beside the vowel chart */
  .vstrip{display:flex;flex-direction:column;gap:5px;padding:6px 8px;border-radius:4px;color:#e8d6b0;
    background:var(--display);box-shadow:inset 0 2px 7px rgba(0,0,0,.5)}
  .vstrip .vhd{display:flex;align-items:center;gap:8px}
  .vstrip .nm{font-weight:700;text-transform:capitalize;font-size:11px;min-width:34px}
  .vstrip .vinfo{flex:1;min-width:0;font-size:10px;color:#c9b78f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the four timbre params share one row as equal columns (label / slider / value stacked), so they
     stay on a single row from ~280px phones up to desktop instead of wrapping when space is tight */
  .vstrip .params{display:flex;gap:6px}
  .vparam{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:1px}
  .vparam label{font-size:9px;color:#a98a55;letter-spacing:.3px;text-align:center}
  .vparam input[type=range]{width:100%;min-width:0;max-width:none;vertical-align:middle}
  .vparam .pv{font-size:9px;color:#c9b78f;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* voice level lives on its own row below the other four, as wide as they are combined */
  .vstrip .volrow{margin-top:3px}
  .vstrip .volrow .vparam{flex:1;flex-direction:row;align-items:center;gap:6px}
  .vstrip .volrow label{text-align:left}
  .vstrip .volrow input[type=range]{flex:1;width:auto}
  .vstrip .volrow .pv{flex:0 0 auto;min-width:54px;text-align:right}
  svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
  .screen{background:var(--display);border-radius:3px;padding:6px;
    box-shadow:inset 0 2px 9px rgba(0,0,0,.6),inset 0 0 0 2px #0e0904,0 1px 0 var(--bezel-hi)}
  canvas.screen{padding:0}

  @media (max-width:520px){
    body{padding:10px;gap:10px}
    .panel{padding:11px}
    .bar{gap:10px 14px}
    input[type=range]{width:110px}
  }
</style>
</head>
<body>

  <div class="panel bar">
    <button id="play" class="play">▶ Play quartet</button>
    <div class="ctl"><label>Tuning</label><button id="tuning" class="toggle on" title="Swap between just intonation and 12-tone equal temperament (chord root pinned)">Just</button></div>
    <div class="ctl"><label>Vibrato</label><input id="vib" type="range" min="0" max="8" step="0.5" value="3"><span id="vibval" class="val"></span></div>
    <div class="ctl"><label>Jitter</label><button id="jit" class="toggle on" title="Random per-note pitch drift (±4¢)">on</button></div>
    <div class="ctl"><label>Shimmer</label><button id="shim" class="toggle on" title="Random per-note amplitude drift (±4%)">on</button></div>
  </div>

  <div class="panel">
    <div class="seqhd">
      <button id="seqadd-top" class="toggle">＋ Add chord</button>
      <button id="seqclear" class="toggle" title="Remove every chord from the sequence">Clear</button>
      <div class="ctl"><label>Glide</label><input id="glide" type="range" min="0" max="1.5" step="0.05" value="0"><span id="glideval" class="val">0 ms</span></div>
      <span class="grow"></span>
      <button id="tagtoggle" class="toggle" title="Import a Great Tags plain-text export as a sequence">Import tag</button>
      <button id="jsontoggle" class="toggle" title="View, copy, paste, or edit the whole sequence as JSON">Copy · Paste · Edit JSON</button>
    </div>
    <div class="seqmain">
      <!-- JSON lives at the TOP, above the canvas, so it's immediately visible when the button opens it -->
      <div id="jsonwin" class="jsonwin" hidden>
        <div class="jsonwin-hd">
          <span class="jsonwin-title">Sequence JSON</span>
          <button id="jsoncopy" class="toggle" title="Copy this JSON to your clipboard">Copy</button>
          <button id="jsonpaste" class="toggle" title="Paste JSON from your clipboard and load it">Paste</button>
        </div>
        <textarea id="seqjson" spellcheck="false" placeholder="Paste a sequence JSON here, or edit and click away to apply…"></textarea>
      </div>
      <!-- Import a Great Tags plain-text export → a sequence (chords detected; default timbre for now) -->
      <div id="tagwin" class="jsonwin" hidden>
        <div class="jsonwin-hd">
          <span class="jsonwin-title">Import Great Tags text</span>
          <span id="tagmsg" class="tagmsg"></span>
          <button id="tagpaste" class="toggle" title="Paste from your clipboard">Paste</button>
          <button id="tagload" class="toggle" title="Parse the text and load it as a sequence">Import →</button>
        </div>
        <textarea id="tagbox" spellcheck="false" placeholder="Paste a Great Tags plain-text export here, then click Import →"></textarea>
        <div id="tagwarn" class="tagwarn" hidden></div>
      </div>
      <!-- the voicing lattice keeps its vertical orientation but sits to the LEFT of the black canvas
           (shown only when a chord is focused); the canvas fills the remaining width -->
      <div class="stage">
        <div id="voicing" class="vcol"></div>
        <div id="seqcanvas" class="seqcanvas">
          <div id="cliplbl" class="cliplbl">level —</div>
          <!-- four analysis lanes: imported audio vs. synth output, waveform then spectrogram. The two
               audio lanes are placeholders until Milestone 2's recording import lands. -->
          <div class="lanes">
            <div class="lane placeholder wf"><span class="lanelab">audio · waveform</span></div>
            <div class="lane"><span class="lanelab">synth · waveform</span>
              <canvas id="scope" width="1000" height="150"></canvas></div>
            <div class="lane placeholder"><span class="lanelab">audio · spectrogram</span></div>
            <div class="lane"><span class="lanelab">synth · spectrogram</span>
              <canvas id="spectrum" width="1000" height="150"></canvas></div>
          </div>
          <div id="seqbar" class="seqbar"></div>            <!-- chords row (lyrics row will sit below) -->
        </div>
      </div>
      <!-- editor for the focused chord: big key + root wheels on the left (where the speller used to be),
           the chord vocabulary on the right. The lattice above is the respell surface. -->
      <div id="chordeditor" class="chordeditor" hidden>
        <div class="edcols">
          <div class="dials big">
            <svg id="keydial" viewBox="0 0 340 340" preserveAspectRatio="xMidYMid meet" role="slider" aria-label="Key center"></svg>
            <svg id="rootdial" viewBox="0 0 340 340" preserveAspectRatio="xMidYMid meet" role="slider" aria-label="Chord root"></svg>
          </div>
          <div id="chords" class="grid big"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <h3 style="margin:0">Vowel chart &nbsp;·&nbsp; drag a voice</h3>
      <button id="moveall" class="toggle on">move: all voices</button>
    </div>
    <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
      <svg id="chart" class="screen" viewBox="0 0 380 300" preserveAspectRatio="xMidYMid meet" style="max-width:440px;flex:1 1 280px;min-width:240px"></svg>
      <div style="flex:1 1 360px;min-width:280px">
        <div id="strips" style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>
  </div>



<script>
(() => {
  // ============================================================ shared helpers
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const rval = s => { const [n,d]=s.split("/").map(Number); return n/d; };
  const octRed = v => { while(v>=2)v/=2; while(v<1)v*=2; return v; };
  const gcd = (a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };
  const lcm = (a,b)=> a/gcd(a,b)*b;
  // nearest 12-tone-equal-tempered interval to a just ratio (used by the JI↔ET toggle)
  const etOf = ratio => Math.pow(2, Math.round(12*Math.log2(ratio))/12);
  const NOTE_NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  const midiToFreq = m => 440*Math.pow(2,(m-69)/12);
  function noteName(f){
    const m = Math.round(69+12*Math.log2(f/440));
    const cents = Math.round(100*(12*Math.log2(f/440) - (m-69)));
    const nm = NOTE_NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1);
    return nm + (cents>=0?"+":"") + cents + "¢";
  }

  //#region snapshot — PURE, DOM-FREE: normalize an arbitrary parsed object into a clean snapshot.
  // (test/state.test.mjs slices this region out of the HTML and evals it). Keep it free of any
  // reference to the DOM or to app constants: it takes app defaults as a parameter so the app
  // stays the single source of truth. Snapshots are the atom of a sequence slot; persistence is the
  // sequence JSON document (see the sequencer section). A version field + normalizeSnapshot filling
  // any omitted field (and dropping extras) is what keeps older/newer saved documents loadable.
  const SCHEMA_VERSION = 1;
  const VOICE_MODES = ["voice","sine","sawtooth","triangle","square"];

  function defaultSnapshot(d){
    return {
      v: SCHEMA_VERSION,
      key: d.key, root: d.root, chord: d.chord,
      et: d.et, moveAll: d.moveAll,
      vib: d.vib, jit: d.jit, shim: d.shim, vol: d.vol,
      voicing: [],                          // [] => "let the app derive the chord's default voicing"
      voices: d.voices.map(v => ({...v})),

  const _num  = (x,dflt) => Number.isFinite(+x) ? +x : dflt;
  const _bool = (x,dflt) => typeof x === "boolean" ? x : dflt;
  const _int  = (x,dflt) => Number.isFinite(+x) ? Math.round(+x) : dflt;

  // Coerce arbitrary parsed input into a clean snapshot shaped exactly like defaultSnapshot(defs).
  function normalizeSnapshot(raw, defs){
    const D = defaultSnapshot(defs);

      v: SCHEMA_VERSION,
      key: _num(raw.key, D.key),
      root: _int(raw.root, D.root),
      chord: _int(raw.chord, D.chord),
      et: _bool(raw.et, D.et),
      moveAll: _bool(raw.moveAll, D.moveAll),
      vib: _num(raw.vib, D.vib),
      jit: _num(raw.jit, D.jit),
      shim: _num(raw.shim, D.shim),
      vol: _num(raw.vol, D.vol),

      voices: D.voices.map((dv,i) => {

        if(!rv || typeof rv !== "object") return {...dv};
        return {
          bri: _num(rv.bri, dv.bri), nas: _num(rv.nas, dv.nas), f3: _num(rv.f3, dv.f3),
          lvl: _num(rv.lvl, dv.lvl), bend: _num(rv.bend, dv.bend),
          mode: VOICE_MODES.includes(rv.mode) ? rv.mode : dv.mode,
          mute: _bool(rv.mute, dv.mute),

  // ============================================================ music data
  // chord ratios relative to chord root (4 voices; triads double the root)
  const CHORDS = [

    {name:"Dom7",  r:["1/1","5/4","3/2","7/4"]},
    {name:"Maj add9",  r:["1/1","9/8","5/4","3/2"]},
    {name:"Min",       r:["1/1","6/5","3/2","1/1"]},
    {name:"Min7",      r:["1/1","6/5","3/2","9/5"]},
    {name:"Maj6",      r:["1/1","5/4","3/2","5/3"]},
    {name:"Min6",      r:["1/1","6/5","3/2","5/3"]},
    {name:"Half-dim7", r:["1/1","6/5","7/5","9/5"]},
    {name:"Dim7",      r:["1/1","6/5","7/5","5/3"]},   // true fully-diminished 7th [0,3,6,9] in JI (top = 5/3)
    {name:"Maj7",      r:["1/1","5/4","3/2","15/8"]},
    {name:"Dom7 ♭5",   r:["1/1","5/4","7/5","7/4"]},
    {name:"Aug",       r:["1/1","5/4","8/5","1/1"]},
    {name:"Dom9 no5",  r:["1/1","5/4","7/4","9/8"]},   // fifthless dominant 9th — 4:5:7:9 over the root (appended to keep older shared-URL chord indices stable)

    {lab:"3",r:"5/4"},{lab:"4",r:"4/3"},{lab:"♯4",r:"7/5"},{lab:"5",r:"3/2"},
    {lab:"♭6",r:"8/5"},{lab:"6",r:"5/3"},{lab:"♭7",r:"9/5"},{lab:"7",r:"15/8"},
  ];

  // chord is named AS A WHOLE — the root dial (rim + center) and the sequencer box's chord label —
  // never for the per-voice scale degrees on the chips or lattice (those stay Arabic).
  const ROMAN = ["I","♭II","II","♭III","III","IV","♯IV","V","♭VI","VI","♭VII","VII"];

  //#region tonecolor — PURE, DOM-FREE: map a chord-tone role label (R, 3, ♭7, 9, …) to one color per
  // harmonic FUNCTION, so the same function reads as the same color everywhere it appears (the chip
  // stack in the sequencer and the voicing lattice in the editor). Root / third / fifth / sixth /
  // seventh / ninth / eleventh each get a hue; anything else falls back to neutral. Chosen to stay
  // legible on both the dark chip tiles and the light editor panel. (test/tonecolor.test.mjs.)
  const TONE_COLORS = {
    root:"#e8703a", third:"#2f9e57", fifth:"#3d84cf", sixth:"#17a191",
    seventh:"#8a6ee0", ninth:"#d19a00", eleventh:"#c85a9c", other:"#9a7d4a",
  };
  function toneClass(role){
    const s = String(role);
    if(s === "R")                 return "root";
    if(s === "11" || s === "4")   return "eleventh";
    if(s.includes("9"))           return "ninth";     // 9, ♭9
    if(s.includes("7"))           return "seventh";   // ♭7, 7
    if(s.includes("6"))           return "sixth";     // 6, ♭6
    if(s.includes("5") || s === "♯4") return "fifth"; // 5, ♯5, and the tritone ♯4/♭5 as an altered fifth

  //#endregion tonecolor

  //#region tagimport — PURE, DOM-FREE: parse a Great Tags plain-text export + detect chords. Node-testable.
  // The export stacks four voices per phrase with the lyric line in the middle: Tenor / Lead / <lyric> /
  // Bari / Bass. A voice token is a major-scale degree 1–7, where '+'/'-' are sharp/flat accidentals and
  // '↑'/'↓' are octave shifts (ignored here — only pitch class matters). The key is in [..] on line 1.
  // parseTag → {key, chords:[{parts:[tenor,lead,bari,bass] as key-relative semitones 0–11]}]}. detectChord
  // finds the best (root scale-degree 0–11, chord-quality index) in the app's vocabulary for a pitch set.
  const TAG_MAJOR = {1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11};
  const TAG_TOKEN = /^([↑↓]*)([+\-]*)(\d)$/;                 // octave arrows | +/- accidentals | scale degree
  function tagToken(tok){                                    // → {pc: key-relative semitone, arr: net ↑/↓ octaves}
    const m = TAG_TOKEN.exec(tok); if(!m) return null;
    let pc = TAG_MAJOR[+m[3]]; if(pc==null) return null;
    for(const c of m[2]) pc += (c==="+") ? 1 : -1;           // '+' sharp, '-' flat
    let arr = 0; for(const c of m[1]) arr += (c==="↑") ? 1 : -1;
    return { pc: ((pc%12)+12)%12, arr };
  }
  const tagTokenPC = tok => { const t = tagToken(tok); return t ? t.pc : null; };
  const TAG_HOLD = /^-{2,}$/;                                // a run of dashes = "hold the previous note"
  const tagIsVoiceLine = l => { const t=l.trim().split(/\s+/); return t[0]!=="" && t.every(x=>TAG_TOKEN.test(x) || TAG_HOLD.test(x) || x==="~"); };
  // Voices are aligned by CHARACTER COLUMN, not token index, so swipes work: `------` (or just an absent
  // token) means a voice HOLDS its last note while another voice moves through a run (its notes joined by
  // `~`). Note columns are clustered into beats (within-beat spread ≤1 char, inter-beat gap ≥2); at each
  // beat a voice with no note there repeats its previous pitch. A held note carries no octave arrow.
  function parseTag(text){
    const lines = String(text).replace(/\r/g,"").split("\n");
    const km = /\[\s*([A-G][#b♭♯]?)\s*\]/.exec(lines[0]||"");
    const chords = [], warnings = [];
    let block = [], blockLine = 0;
    const flush = () => {
      const vlines = block.filter(tagIsVoiceLine);              // T, L, Ba, Bs
      if(block.length && vlines.length && vlines.length!==4){   // looked like music but didn't come out to 4 voices
        const bad = block.filter(l => l.trim() && !tagIsVoiceLine(l) && !/[A-Za-z]{3}/.test(l));
        warnings.push(`Line ${blockLine}: found ${vlines.length} voice line(s), expected 4 — skipped this block`
          + (bad.length ? `. Unreadable: ${bad.map(l=>`"${l.trim().slice(0,24)}"`).join(", ")}` : "."));
      }
      if(vlines.length===4){
        const vnotes = vlines.map(l => {                        // real notes only, with their column
          const out=[], re=/\S+/g; let m;
          while((m=re.exec(l))){ const t=tagToken(m[0]); if(t) out.push({col:m.index, pc:t.pc, arr:t.arr}); }
          return out;
        });
        const cols = [...new Set(vnotes.flatMap(nl=>nl.map(n=>n.col)))].sort((a,b)=>a-b);
        const beats=[];
        for(const c of cols){ const b=beats[beats.length-1]; if(b && c-b.hi<=1) b.hi=c; else beats.push({lo:c,hi:c}); }
        const prevPC=[null,null,null,null];
        let dropped=0;
        for(const b of beats){
          const parts=[], arr=[]; let full=true;
          for(let vi=0; vi<4; vi++){
            const hit = vnotes[vi].filter(n=>n.col>=b.lo-1 && n.col<=b.hi+1);
            if(hit.length){ const t=hit[hit.length-1]; prevPC[vi]=t.pc; parts.push(t.pc); arr.push(t.arr); }
            else if(prevPC[vi]!=null){ parts.push(prevPC[vi]); arr.push(0); }   // hold: same pitch, no arrow
            else { full=false; parts.push(null); arr.push(0); }
          }
          if(full) chords.push({parts, arr}); else dropped++;
        }
        if(dropped) warnings.push(`Line ${blockLine}: ${dropped} column(s) couldn't be aligned across all four voices.`);
      }
      block = [];
    };
    for(let i=1;i<lines.length;i++){
      if(lines[i].trim()===""){ flush(); }
      else { if(!block.length) blockLine = i+1; block.push(lines[i]); }
    }
    flush();
    if(!km) warnings.push('No key found in the title line (expected e.g. "[B♭]") — defaulting to B♭.');
    return { key: km ? km[1] : null, chords, warnings };
  }
  function detectChord(pcs, music){
    const {CHORDS, rval, octRed} = music;
    const want = [...new Set(pcs.map(p=>((p%12)+12)%12))];
    const pcOf = r => (((Math.round(12*Math.log2(octRed(rval(r))))%12)+12)%12);
    let best=null;
    for(let root=0; root<12; root++){
      for(let ci=0; ci<CHORDS.length; ci++){
        const set = [...new Set(CHORDS[ci].r.map(r=>(pcOf(r)+root)%12))];
        const missing = want.filter(p=>!set.includes(p)).length;   // chord tones we needed but don't have
        const extra   = set.filter(p=>!want.includes(p)).length;   // chord tones present but not wanted
        const score = missing*10 + extra*3 + ci*0.02;              // exact first, then fewest extras, then common chords
        // `covers` = every sung note is a chord tone (extra chord tones just mean an incomplete voicing,
        // e.g. a unison or a triad with a doubling — that's faithful, not an approximation).
        if(!best || score<best.score) best={root, chord:ci, score, exact:(missing===0 && extra===0), covers:(missing===0)};
      }
    }
    return best;
  }
  //#endregion tagimport

  //#region chip — PURE, DOM-FREE: derive a slot's stacked scale-degree display. Node-testable.
  // (test/chip.test.mjs slices this region out of the HTML and evals it.)
  //
  // A chord "chip" shows the four PARTS stacked in fixed order — Tenor / Lead / Bari / Bass, top→bottom
  // (bass on the bottom) — each labeled by its scale degree relative to the KEY, snapped to the nearest
  // chromatic degree so JI detuning never renames a note. The order is by PART, not by sounding pitch,
  // so a row always means the same voice even when voices cross. voicing[i] is what part i sings
  // (i: 0=bass … 3=tenor), so rows are voicing reversed. Purely a function of the snapshot's root +
  // chord + voicing (no audio) → testable. `music` injects DEGREES (chromatic, index = semitone 0..11),
  // CHORDS, ITV (chord-tone role, kept for tooltips), and rval/octRed. Returns rows top→bottom: {deg, role}.
  function chipRows(snap, music){
    const {DEGREES, CHORDS, ITV, rval, octRed} = music;
    const chord = CHORDS[snap && snap.chord] || CHORDS[0];
    const rootVal = rval((DEGREES[snap && snap.root] || DEGREES[0]).r);
    const voicing = (snap && Array.isArray(snap.voicing) && snap.voicing.length)
      ? snap.voicing
      : chord.r.map((_, i) => [i, 0]);   // no explicit voicing → part i sings tone i (root position)
    const rows = voicing.map(slot => {
      const tone = Array.isArray(slot) ? slot[0] : slot.tone;
      const toneStr = chord.r[tone] || "1/1";
      const pc = octRed(rootVal * rval(toneStr));                  // pitch class rel key, octave-reduced
      const degIdx = ((Math.round(12*Math.log2(pc)) % 12) + 12) % 12;
      return {
        deg:  (DEGREES[degIdx] || DEGREES[0]).lab,                 // scale-degree name in the key
        role: ITV[toneStr] || "?",                                 // chord-tone function (tooltip only now)
      };
    });
    return rows.reverse();   // voicing is bass→tenor; reverse → tenor at top, bass at bottom
  }
  //#endregion chip

  // ============================================================ chart constants
  const VOICE_COLORS = ["#ff6f91","#ffd166","#06d6a0","#4d96ff"]; // bass, bari, lead, tenor (L→R)
  const VOICE_NAMES = ["bass","bari","lead","tenor"];             // L→R = synths 1..4
  const VOICE_TAGS  = ["Bs","Br","L","T"];                        // short tags for the vowel-chart dots
  const GRAY_TXT="#a98a55";

  const DEFAULT_FORMANTS = [
    {F:500, min:250, max:900, fixed:false, on:true},
    {F:1500,min:700, max:2300,fixed:false, on:true},
    {F:2500,min:1800,max:3000,fixed:false, on:true},
    {F:3500,min:3500,max:3500,fixed:true,  on:true},
    {F:4500,min:4500,max:4500,fixed:true,  on:true},
  ];

  const CVBW=380,CVBH=300,CX0=46,CX1=356,CY0=18,CY1=250;
  const F1LO=250,F1HI=900,F2HI=2400,F2LO=700;

  // (the set of F1/F2 ratios between voices) is a rigid figure you can slide without distortion.
  const lF1LO=Math.log(F1LO),lF1HI=Math.log(F1HI),lF2LO=Math.log(F2LO),lF2HI=Math.log(F2HI);
  const cxOfF2=f2=>CX0+(lF2HI-Math.log(clamp(f2,F2LO,F2HI)))/(lF2HI-lF2LO)*(CX1-CX0);
  const cyOfF1=f1=>CY0+(Math.log(clamp(f1,F1LO,F1HI))-lF1LO)/(lF1HI-lF1LO)*(CY1-CY0);
  const VOWELS=[
    {ipa:"i",f1:342,f2:2322},{ipa:"ɪ",f1:427,f2:2034},{ipa:"eɪ",f1:476,f2:2089},
    {ipa:"ɛ",f1:580,f2:1799},{ipa:"æ",f1:588,f2:1952},{ipa:"ɑ",f1:768,f2:1333},
    {ipa:"ɔ",f1:652,f2:997},{ipa:"oʊ",f1:497,f2:910},{ipa:"ʊ",f1:469,f2:1122},
    {ipa:"u",f1:378,f2:997},{ipa:"ʌ",f1:623,f2:1200},{ipa:"ɝ",f1:474,f2:1379},
    {ipa:"ə",f1:500,f2:1500},
  ];

  // ============================================================ global state
  const state = {
    keyMidi: 57,             // A3 (the coarse dial's discrete note)
    keyFreq: 220,            // A3 — derived: midiToFreq(keyMidi)
    bendCents: 0,            // global pitch bend (cents) — the fine dial; presented as fine-tuning the key center
    rootIdx: 0,              // degree index
    chordIdx: 1,             // Dom7 
    voicing: [],             // [{tone, octave}] left->right
    absPcs: [],              // pitch classes (rel key center) per chord tone
    // global timbre (falloff & bandwidth are per-voice)
    vibCents:3, jitterCents:4, shimmer:0.04, volume:0.36,   // volume is the pinned master gain (MASTER_GAIN); no UI
    playing:false,
    et:false,                // false = just intonation, true = 12-tone equal temperament (chord root pinned)
    fundHz:null,             // implied (JI-ideal) fundamental of the current chord, in Hz
    moveAll:true,            // default ON: sliders + vowel-chart drags gang across all four voices
                             // (mute/solo are always per-voice — this only governs *moving* things)
  };
  const DEFAULT_SRCEXP=1.2, DEFAULT_BWFRAC=0.06;

  const TYP_F0=0.8, TYP_F1=1.8, TYP_B0=0.04, TYP_B1=0.09;

  const padX=s=>PPX0+(s-TYP_F0)/(TYP_F1-TYP_F0)*(PPX1-PPX0);

  // Pinned master gain (no user slider). Gain-staged from an offline-render sweep of the actual graph:
  // the worst-case four-voice peak at per-voice max (0 dB) is ~2.17 at unity master, so 0.36 keeps it
  // to ~-2 dBFS (never clips), while one voice at the slider's -48 dB floor lands ~-65 dBFS (the
  // quietest still-audible level at full system volume). Per-voice level range is set to match.
  const MASTER_GAIN=0.36;
  // Jitter & shimmer are now global on/off toggles; these are their "on" magnitudes (0 when off).
  const JITTER_AMT=4, SHIMMER_AMT=0.04;

  // ============================================================ audio
  let ctx=null, masterOut=null, masterBus=null, humanTimer=null;
  let analyser=null, scopeRAF=null, timeBuf=null, freqBuf=null;
  const voices=[];   // each: {formants, freq, muted, level, mode, bend, srcExp, bwFrac, audio nodes..., infoEl}
  // Portamento for stepping between sequence slots. `stepGlide` is a transient set only for the
  // duration of a slot-step's applySnapshot() call; every other retune (dial drags, etc.) reads
  // null and keeps the snappy default. glide=0 → the pre-existing instant behavior.
  let stepGlide = null;
  const retuneTau = () => (stepGlide != null && stepGlide > 0) ? stepGlide/3 : 0.04;

  function computeWave(f0,srcExp){
    const top=Math.min(HEARING_TOP, ctx.sampleRate/2);
    const N=Math.max(1,Math.floor(top/f0));
    const real=new Float32Array(N+1), imag=new Float32Array(N+1);
    for(let n=1;n<=N;n++) imag[n]=Math.pow(n,-srcExp);

  //#region audio-session — PURE, DOM-FREE: iOS silent-switch policy. Node-testable
  // (test/audio-session.test.mjs slices this region out of the HTML and evals it.)
  //
  // iOS hands every page an "ambient" audio session, and the ringer/silent switch mutes ambient
  // audio. So with the switch flipped an iPhone plays nothing from Web Audio, while native apps
  // and plain <audio> elements keep sounding — which is the bug this fixes. Declaring "playback"
  // (Safari 16.4+) puts us in the session native media players use, which the switch doesn't
  // touch. There is no way to ask for this from the AudioContext itself.
  //
  // Re-asserted on every ensureAudio() rather than set once at load, because iOS can hand the
  // page back an ambient session after an interruption (a call, Siri, another app taking audio
  // focus). Assignment is skipped when we already hold a playback session.
  //
  // The return value is diagnostic only — the app ignores it, the tests pin it down:
  //   "unsupported" — no AudioSession API (non-Safari browsers, iOS < 16.4)
  //   "already"     — the page is already in a playback session, nothing to do
  //   "set"         — we moved it into one
  //   "failed"      — the setter threw, or the type didn't take
  function requestPlaybackSession(nav){
    const session = nav && nav.audioSession;
    if(!session || typeof session.type !== "string") return "unsupported";
    if(session.type === "playback") return "already";
    try{ session.type = "playback"; }
    catch(e){ return "failed"; }
    return session.type === "playback" ? "set" : "failed";

  function ensureAudio(){

      masterBus=ctx.createGain(); masterBus.gain.value=1; masterBus.connect(masterOut);

        v.sourceBus=ctx.createGain(); v.sourceBus.gain.value=1;
        v.formantMix=ctx.createGain(); v.formantMix.gain.value=1;
        v.voiceGain=ctx.createGain(); v.voiceGain.gain.value=0;
        v.formantMix.connect(v.voiceGain); v.voiceGain.connect(masterBus);
        v.bp=[]; v.fg=[];
        for(let i=0;i<v.formants.length;i++){
          const f=ctx.createBiquadFilter(); f.type="bandpass";
          const g=ctx.createGain(); g.gain.value=0;
          v.sourceBus.connect(f); f.connect(g); g.connect(v.formantMix);
          v.bp[i]=f; v.fg[i]=g;
        }
        // dry bypass: pass the raw buzz when this voice has all formants off
        v.dryGain=ctx.createGain(); v.dryGain.gain.value=0;
        v.sourceBus.connect(v.dryGain); v.dryGain.connect(v.formantMix);
        v.vibLFO=ctx.createOscillator(); v.vibLFO.type="sine";
        v.vibLFO.frequency.value=VIB_RATE*(0.96+0.08*Math.random()); // slight per-voice detune of vibrato
        v.vibDepth=ctx.createGain(); v.vibDepth.gain.value=state.vibCents;
        v.vibLFO.connect(v.vibDepth); v.vibLFO.start();
