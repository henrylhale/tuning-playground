name: Deploy to henryhale.com/tuning

# This workflow no longer copies HTML into the `landing` repo.
#
# `landing` now pulls the apps from this repo at build time, at the commit
# recorded in its .tuning-version file. All this job does is move that
# pointer, which makes landing's Pages workflow rebuild and publish.
#
# Why: previously this job wrote ~900 lines of built HTML into `landing`,
# which meant the apps had two homes and a stale local checkout of
# `landing` could revert the live versions. There is now exactly one
# source of truth — this repo.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/deploy-to-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tuning-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Point landing at this commit
        run: |
          set -euo pipefail
          git config --global user.name "tuning-playground-bot"
          git config --global user.email "actions@users.noreply.github.com"
          git clone --depth 1 git@github.com:henrylhale/landing.git landing
          cd landing
          printf '%s\n' "${GITHUB_SHA}" > .tuning-version
          if git diff --quiet -- .tuning-version; then
            echo "landing is already pinned to ${GITHUB_SHA::7} — nothing to do."
            exit 0
          fi
          git add .tuning-version
          git commit -m "Pin tuning apps to tuning-playground@${GITHUB_SHA::7}"
          git push origin main
          echo "Pinned landing to ${GITHUB_SHA::7}; its Pages workflow will rebuild."
